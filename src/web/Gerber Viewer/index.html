<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f7">
    <title>Gerber Viewer</title>
    <link rel="icon" href="img/module_icon.svg">
    <script src="../script/jquery.min.js"></script>
    <script src="../script/ao_module.js"></script>
    <script src="../script/applocale.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "./lib/three/three.module.min.js",
            "three/addons/": "./lib/three/addons/"
        }
    }
    </script>
</head>

<body>
    <!-- Icon sprite: hand drawn inline SVG, no emoji (contribution rule 6) -->
    <svg id="iconsprite" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="ic-pointer" viewBox="0 0 24 24"><path d="M6 3.5l12.5 7.1-5.7 1.6-2.5 5.6z" /></symbol>
            <symbol id="ic-hand" viewBox="0 0 24 24">
                <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11" /><path d="M12 11V4.5a1.5 1.5 0 0 1 3 0V11" />
                <path d="M15 11V6.5a1.5 1.5 0 0 1 3 0V13" />
                <path d="M9 11V9.5a1.5 1.5 0 0 0-3 0V15c0 3.3 2.2 6 5.5 6h1.5c3 0 5-2.4 5-5.5V13" />
            </symbol>
            <symbol id="ic-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5l5 5M8 10.5h5M10.5 8v5" /></symbol>
            <symbol id="ic-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5l5 5M8 10.5h5" /></symbol>
            <symbol id="ic-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /><rect x="8.5" y="8.5" width="7" height="7" rx="1" /></symbol>
            <symbol id="ic-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" /><path d="M20 4v4h-4" /></symbol>
            <symbol id="ic-ruler" viewBox="0 0 24 24">
                <path d="M3.5 15.5L15.5 3.5l5 5-12 12z" /><path d="M7 12l1.8 1.8M10 9l2.6 2.6M13 6l1.8 1.8" />
            </symbol>
            <symbol id="ic-flip" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2.2" /><path d="M9 7L4 12l5 5z" /><path d="M15 7l5 5-5 5z" /></symbol>
            <symbol id="ic-layers" viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z" /><path d="M3.5 12.2l8.5 4.5 8.5-4.5" /><path d="M3.5 16.2l8.5 4.5 8.5-4.5" /></symbol>
            <symbol id="ic-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></symbol>
            <symbol id="ic-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M15 4v16" /></symbol>
            <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" /><circle cx="12" cy="12" r="2.8" /></symbol>
            <symbol id="ic-eye-off" viewBox="0 0 24 24">
                <path d="M9.9 5.7A10 10 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-2.6 3.4M6.4 6.9C3.6 8.6 2 12 2 12s3.6 6.5 10 6.5a9.7 9.7 0 0 0 4.9-1.3" />
                <path d="M9.9 10a2.8 2.8 0 0 0 4 4M3 3l18 18" />
            </symbol>
            <symbol id="ic-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5.5" /><circle cx="12" cy="7.8" r="0.6" fill="currentColor" /></symbol>
            <symbol id="ic-bulb" viewBox="0 0 24 24"><path d="M9 17.5h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2v1.5h5V16c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" /></symbol>
            <symbol id="ic-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l2 2.2h8.8A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" /></symbol>
            <symbol id="ic-drive" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="7" rx="1.8" /><rect x="3" y="13" width="18" height="7" rx="1.8" />
                <circle cx="7" cy="7.5" r="0.7" fill="currentColor" /><circle cx="7" cy="16.5" r="0.7" fill="currentColor" /><path d="M11 7.5h6M11 16.5h6" />
            </symbol>
            <symbol id="ic-laptop" viewBox="0 0 24 24"><rect x="4.5" y="5" width="15" height="10" rx="1.4" /><path d="M2.5 18.5h19l-1.5-3.5H4z" /></symbol>
            <symbol id="ic-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z" /><path d="M14 3v5h5" /></symbol>
            <symbol id="ic-file-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z" /><path d="M14 3v5h5M12 11.5v6M9 14.5h6" /></symbol>
            <symbol id="ic-zip" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z" /><path d="M11 4v2M11 8v2M11 12v2" /><rect x="9.5" y="14.5" width="3" height="3.5" rx="0.8" /></symbol>
            <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
            <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
            <symbol id="ic-chevron-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" /></symbol>
            <symbol id="ic-chevron-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6" /></symbol>
            <symbol id="ic-grip" viewBox="0 0 24 24">
                <circle cx="9" cy="6.5" r="1.2" fill="currentColor" stroke="none" /><circle cx="15" cy="6.5" r="1.2" fill="currentColor" stroke="none" />
                <circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none" /><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none" />
                <circle cx="9" cy="17.5" r="1.2" fill="currentColor" stroke="none" /><circle cx="15" cy="17.5" r="1.2" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="ic-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" /><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5" /></symbol>
            <symbol id="ic-gear" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
            </symbol>
            <symbol id="ic-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2l1-12M9 7V4.5h6V7" /></symbol>
            <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.5L4 8.5M4 13a8 8 0 0 0 14.3 4.5l1.7-2" /><path d="M4 4v4.5h4.5M20 20v-4.5h-4.5" /></symbol>
            <symbol id="ic-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4.5 19.5h15" /></symbol>
            <symbol id="ic-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4.5 19.5h15" /></symbol>
            <symbol id="ic-print" viewBox="0 0 24 24"><path d="M7 8V3.5h10V8" /><rect x="3.5" y="8" width="17" height="8.5" rx="1.6" /><path d="M7 14h10v6.5H7z" /></symbol>
            <symbol id="ic-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.2" /><circle cx="8.5" cy="10" r="1.6" /><path d="M4 17l5-4.6 4.2 3.8 3-2.6L20 17.6" /></symbol>
            <symbol id="ic-cube" viewBox="0 0 24 24"><path d="M12 2.6l8 4.2v9.4l-8 4.2-8-4.2V6.8z" /><path d="M4 6.8l8 4.2 8-4.2M12 11v9.4" /></symbol>
            <symbol id="ic-table" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="1.8" /><path d="M3 9.5h18M3 14.5h18M9.5 4.5v15" /></symbol>
            <symbol id="ic-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" /><path d="M6 9.5h.01M9 9.5h.01M12 9.5h.01M15 9.5h.01M18 9.5h.01M7.5 14.5h9" /></symbol>
            <symbol id="ic-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8" /><circle cx="12" cy="17" r="0.6" fill="currentColor" /></symbol>
            <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
            <symbol id="ic-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3.5" /><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4" /></symbol>
            <symbol id="ic-code" viewBox="0 0 24 24"><path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5M13.5 4.5l-3 15" /></symbol>
            <symbol id="ic-drill" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" /></symbol>
            <symbol id="ic-chip" viewBox="0 0 24 24">
                <rect x="6" y="6" width="12" height="12" rx="1.8" /><rect x="9.5" y="9.5" width="5" height="5" rx="0.6" />
                <path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3" />
            </symbol>
            <symbol id="ic-board" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="1.8" /><circle cx="6.5" cy="8.5" r="1" /><circle cx="17.5" cy="15.5" r="1" />
                <path d="M9 9h3.5l2 2v4.5M6.5 15.5H11" /><rect x="13" y="7" width="4" height="2.5" rx="0.5" />
            </symbol>
            <symbol id="ic-palette" viewBox="0 0 24 24">
                <path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-1 2-2s-.8-1.5-.8-2.5 1-1.8 2.2-1.8H18a3 3 0 0 0 3-3c0-4.7-4-8.7-9-8.7z" />
                <circle cx="7.5" cy="11" r="1.1" fill="currentColor" /><circle cx="10" cy="7" r="1.1" fill="currentColor" /><circle cx="14.5" cy="7" r="1.1" fill="currentColor" />
            </symbol>
            <symbol id="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" /></symbol>
            <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
            <symbol id="ic-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
            <symbol id="ic-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3" fill="currentColor" stroke="none" /><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none" /><circle cx="18" cy="12" r="1.3" fill="currentColor" stroke="none" /></symbol>
            <symbol id="ic-warning" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z" /><path d="M12 10v4.5" /><circle cx="12" cy="17.3" r="0.6" fill="currentColor" /></symbol>
            <symbol id="ic-factory" viewBox="0 0 24 24"><path d="M3 20.5V9.5l5 3v-3l5 3v-3l5 3V4h3v16.5z" /><path d="M7 16.5h2M12 16.5h2M17 16.5h2" /></symbol>
            <symbol id="ic-show-all" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" /><circle cx="12" cy="12" r="2.8" fill="currentColor" /></symbol>
        </defs>
    </svg>

    <!-- ===================== Menu bar ===================== -->
    <nav id="menubar" role="menubar">
        <div class="mb-logo" title="Gerber Viewer"><img src="img/module_icon.svg" alt=""></div>
        <div id="menubarItems"></div>
        <div class="mb-spacer"></div>
        <div id="mbStatus" class="mb-status"></div>
    </nav>

    <div id="main">
        <!-- ===================== Workspace ===================== -->
        <section id="workspace">
            <header id="toolbar">
                <div class="tb-title">
                    <span id="projectName" locale="app/title">Gerber Viewer</span>
                    <span id="projectBadge" class="badge" locale="badge/none">No Project</span>
                </div>
                <div class="tb-center">
                    <div class="seg" id="segDim">
                        <button data-dim="2d" class="active" title="2D view">2D</button>
                        <button data-dim="3d" title="3D view (3)">3D</button>
                    </div>
                    <div class="tbgroup" id="toolGroup">
                        <button data-tool="select" class="active" title="Select / inspect (V)"><svg><use href="#ic-pointer" /></svg></button>
                        <button data-tool="pan" title="Pan (H)"><svg><use href="#ic-hand" /></svg></button>
                        <button data-tool="zoom" title="Zoom to area (Z)"><svg><use href="#ic-zoom" /></svg></button>
                        <button data-cmd="fit" title="Zoom to fit (F)"><svg><use href="#ic-fit" /></svg></button>
                        <button data-cmd="rotate" title="Rotate 90 degrees (R)"><svg><use href="#ic-rotate" /></svg></button>
                    </div>
                    <div class="tbgroup">
                        <button data-tool="measure" title="Measure (M)"><svg><use href="#ic-ruler" /></svg></button>
                        <button data-cmd="flip" id="btnFlip" title="View bottom side (B)"><svg><use href="#ic-flip" /></svg></button>
                        <button data-cmd="renderMenu" id="btnRender" title="Render mode"><svg><use href="#ic-layers" /></svg></button>
                    </div>
                    <div class="tbgroup">
                        <button data-cmd="togglePanel" id="btnPanel" title="Show / hide side panel"><svg><use href="#ic-panel" /></svg></button>
                        <button data-cmd="fullscreen" id="btnFullscreen" title="Focus mode"><svg><use href="#ic-expand" /></svg></button>
                    </div>
                </div>
                <div class="tb-right"></div>
            </header>

            <div id="stage">
                <canvas id="cvBase"></canvas>
                <canvas id="cvOverlay"></canvas>
                <div id="view3d" hidden></div>

                <div id="modeChip" class="chip" hidden></div>
                <div id="measureBox" class="floatbox" hidden></div>

                <div id="view3dBar" class="floatbar" hidden>
                    <button data-view3d="iso" locale="view3d/iso">Iso</button>
                    <button data-view3d="top" locale="view3d/top">Top</button>
                    <button data-view3d="bottom" locale="view3d/bottom">Bottom</button>
                    <button data-view3d="front" locale="view3d/front">Front</button>
                    <button data-view3d-mfg data-cmd="mfgToggle" class="mfg-btn"><svg><use href="#ic-factory" /></svg><span locale="view3d/mfg">Manufacturing</span></button>
                </div>

                <div id="mfgPanel" class="mfgpanel" hidden></div>

                <div id="coordBar" class="floatbar">
                    <button id="btnCrosshair" title="Crosshair cursor"><svg><use href="#ic-crosshair" /></svg></button>
                    <span class="coord"><b>X:</b> <span id="coordX">-</span></span>
                    <span class="coord"><b>Y:</b> <span id="coordY">-</span></span>
                    <button id="btnZoom" class="zoomsel" title="Zoom">1:1 <svg><use href="#ic-chevron-down" /></svg></button>
                </div>

                <div id="minimap" title="Click or drag to move the view">
                    <canvas id="cvMini"></canvas>
                </div>

                <div id="emptyState">
                    <div class="es-inner">
                        <div class="es-hero">
                            <img src="img/module_icon.svg" alt="">
                            <h1 locale="app/title">Gerber Viewer</h1>
                            <p locale="empty/intro">Open a PCB fabrication package (zip) or individual Gerber and drill files.</p>
                        </div>
                        <div class="es-actions">
                            <button class="btn primary" data-cmd="openAroz"><svg><use href="#ic-drive" /></svg><span locale="empty/openAroz">Open from ArozOS</span></button>
                            <button class="btn" data-cmd="openLocal"><svg><use href="#ic-laptop" /></svg><span locale="empty/openLocal">Open from This Device</span></button>
                            <button class="btn" data-cmd="openLocalFolder"><svg><use href="#ic-folder" /></svg><span locale="empty/openFolder">Open Folder</span></button>
                        </div>
                        <div class="es-drop" locale="empty/drop">or drop a .zip, a folder or Gerber files anywhere in this window</div>
                        <div class="es-recent" id="esRecent" hidden>
                            <div class="es-recent-h"><svg><use href="#ic-clock" /></svg><span locale="empty/recent">Recent projects</span></div>
                            <div class="es-recent-grid" id="esRecentGrid"></div>
                        </div>
                    </div>
                </div>

                <div id="dropHint" hidden>
                    <div><svg><use href="#ic-upload" /></svg><span locale="drop/hint">Drop to open</span></div>
                </div>

                <div id="loading" hidden>
                    <div class="spinner"></div>
                    <div id="loadingText" locale="loading/default">Loading...</div>
                </div>
            </div>
        </section>

        <!-- ===================== Side panel ===================== -->
        <aside id="sidepanel">
            <div class="tabs" role="tablist">
                <button data-tab="layers" class="active" role="tab" locale="tab/layers">Layers</button>
                <button data-tab="props" role="tab" locale="tab/props">Properties</button>
            </div>
            <div class="tabpane" id="tabLayers">
                <div class="card">
                    <div class="card-h">
                        <svg><use href="#ic-eye" /></svg><span locale="card/visibility">Layer Visibility</span>
                        <div class="card-actions">
                            <button class="iconbtn" data-cmd="showAll" title="Show all layers"><svg><use href="#ic-eye" /></svg></button>
                            <button class="iconbtn" data-cmd="hideAll" title="Hide all layers"><svg><use href="#ic-eye-off" /></svg></button>
                            <button class="iconbtn" data-cmd="layerMenu" title="More"><svg><use href="#ic-more" /></svg></button>
                        </div>
                    </div>
                    <ul id="layerList" class="layerlist"></ul>
                    <div id="layerEmpty" class="muted small pad" locale="layers/empty">No layers loaded.</div>
                </div>
                <div class="card">
                    <div class="card-h"><svg><use href="#ic-info" /></svg><span locale="card/fileInfo">File Information</span></div>
                    <dl id="fileInfo" class="kv"></dl>
                </div>
                <div class="card tip" id="tipCard">
                    <div class="card-h"><svg><use href="#ic-bulb" /></svg><span locale="card/tip">Tip</span>
                        <div class="card-actions"><button class="iconbtn" id="tipNext" title="Next tip"><svg><use href="#ic-chevron-right" /></svg></button></div>
                    </div>
                    <p id="tipText"></p>
                </div>
            </div>
            <div class="tabpane" id="tabProps" hidden></div>
        </aside>
    </div>

    <div id="toasts"></div>
    <input type="file" id="fileInput" multiple hidden>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>

    <script src="js/geom.js"></script>
    <script src="js/gerber.js"></script>
    <script src="js/excellon.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/zip.js"></script>
    <script src="js/board.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/store.js"></script>
    <script src="js/exporter.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dialogs.js"></script>
    <script src="js/mfg.js"></script>
</body>

</html>
