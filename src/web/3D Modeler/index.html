                <div id="drw-tree" role="tree" hidden></div>
            </aside>

            <!-- ================= Viewport and document tabs ================= -->
            <div id="center">
            <main id="stage">
                <canvas id="viewport"></canvas>
                <div id="sheet-stage" hidden></div>
                <div id="prompt" hidden></div>
                <div id="viewcube" title="Click a face, an edge or a corner to look from there">
                    <div id="viewcube-cam"></div>
                    <button id="viewcube-home" class="qa-btn" title="Home View"><svg class="ic"><use href="#ic-home"/></svg></button>
                </div>
                <div id="navbar"></div>
                <svg id="triad" viewBox="-40 -40 80 80" aria-hidden="true"></svg>
                <svg id="orbit-mark" aria-hidden="true" hidden></svg>
                <div id="splash">
                    <div class="splash-box">
                        <div class="spinner"></div>
                        <div id="splash-text">Loading modelling kernel...</div>
                    </div>
                </div>
            </main>
            <nav id="doctabs" role="tablist" aria-label="Open documents"></nav>
            </div>
        </div>

        <!-- ================= Status bar ================= -->
        <footer id="statusbar">
            <span id="status-msg">Ready</span>
            <span class="spacer"></span>
            <span class="status-item" id="status-kernel" title="OpenCascade geometry kernel"><i class="dot"></i>Kernel</span>
            <span class="status-item" id="status-solver" title="planegcs sketch constraint solver"><i class="dot"></i>Solver</span>
            <span class="status-item" id="status-units">mm</span>
        </footer>
    </div>

    <div id="menu" hidden></div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
