<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6a23a"/>
            <stop offset="1" stop-color="#d9661a"/>
        </linearGradient>
    </defs>
    <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)"/>
    <!-- sketch profile on the ground plane -->
    <path d="M32 34 L50 43 L32 52 L14 43 Z" fill="none" stroke="#ffffff" stroke-opacity="0.75"
          stroke-width="1.6" stroke-dasharray="3 2.4" stroke-linejoin="round"/>
    <!-- extruded block: top, left, right -->
    <path d="M32 12 L46 19 L32 26 L18 19 Z" fill="#ffffff"/>
    <path d="M18 19 L32 26 L32 45 L18 38 Z" fill="#ffe3c2"/>
    <path d="M46 19 L46 38 L32 45 L32 26 Z" fill="#fbc78d"/>
