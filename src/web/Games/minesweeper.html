<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - ArozOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 520px;
            padding: 16px 0;
        }

        #backBtn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #backBtn:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        #backBtn svg {
            width: 16px;
            height: 16px;
        }

        .game-info {
            display: flex;
            gap: 24px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
        }

        .game-info span {
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        #resetBtn {
            background: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #resetBtn:hover {
            transform: scale(1.1);
            border-color: rgba(255, 215, 0, 0.6);
        }

        #resetBtn svg {
            width: 20px;
            height: 20px;
        }

        .difficulty-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #aaa;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .diff-btn:hover, .diff-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
            color: #ffd700;
        }

        #board {
            display: grid;
            gap: 1px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 4px;
            padding: 2px;
        }

        .cell {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.1s;
        }

        .cell.hidden {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .cell.hidden:hover {
            background: linear-gradient(135deg, #333333, #2a2a2a);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .cell.revealed {
            background: rgba(255, 255, 255, 0.03);
        }

        .cell.flagged {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
        }

        .cell.mine-exploded {
            background: rgba(255, 100, 50, 0.5);
        }

        .cell.mine-shown {
            background: rgba(255, 215, 0, 0.1);
        }

        .n1 { color: #5b9bd5; }
        .n2 { color: #4caf50; }
        .n3 { color: #ffd700; }
        .n4 { color: #c77dff; }
        .n5 { color: #ff5722; }
        .n6 { color: #00bcd4; }
        .n7 { color: #ffd700; }
        .n8 { color: #888; }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.hidden {
            display: none;
        }

        .modal {
            background: #141414;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            max-width: 300px;
        }

        .modal h2 {
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        .modal.win h2 {
            color: #4caf50;
        }

        .modal.lose h2 {
            color: #ff6432;
        }

        .modal p {
            margin-bottom: 20px;
            color: #888888;
        }

        .modal button {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 4px;
            transition: background 0.2s;
        }

        .modal button:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        .cell svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button id="backBtn" onclick="goBack()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
        </button>
        <button id="resetBtn" onclick="initGame()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 12C3 7.03 7.03 3 12 3C15.5 3 18.58 5 20 8" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
                <path d="M21 4V9H16" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 12C21 16.97 16.97 21 12 21C8.5 21 5.42 19 4 16" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
                <path d="M3 20V15H8" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="game-info">
            <span id="mineCount">Mines: 0</span>
            <span id="timer">Time: 0s</span>
        </div>
    </div>

    <div class="difficulty-bar">
        <button class="diff-btn active" onclick="setDifficulty(0)">Beginner</button>
        <button class="diff-btn" onclick="setDifficulty(1)">Intermediate</button>
        <button class="diff-btn" onclick="setDifficulty(2)">Expert</button>
    </div>

    <div id="board"></div>

    <div class="overlay hidden" id="overlay">
        <div class="modal" id="modal">
            <h2 id="modalTitle"></h2>
            <p id="modalMsg"></p>
            <button onclick="initGame()">Play Again</button>
            <button onclick="goBack(); hideOverlay();">Back to Games</button>
        </div>
    </div>

    <script>
        const DIFFICULTIES = [
            { rows: 9, cols: 9, mines: 10 },
            { rows: 16, cols: 16, mines: 40 },
            { rows: 16, cols: 30, mines: 99 }
        ];

        const FLAG_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 22V4" stroke="#ffd700" stroke-width="2"/><path d="M5 4L20 4L15 11L20 11L5 11" fill="#ffd700" stroke="#ffd700" stroke-width="1.5"/></svg>';
        const BOMB_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="13" r="7" fill="#ff4444" stroke="#ff6432" stroke-width="1.5"/><path d="M12 6V3" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="2" r="1.5" fill="#ffd700"/><path d="M10 3L11 2" stroke="#ffd700" stroke-width="1.5" stroke-linecap="round"/><path d="M14 3L13 2" stroke="#ffd700" stroke-width="1.5" stroke-linecap="round"/></svg>';
        const MISS_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6L18 18M18 6L6 18" stroke="#ff4444" stroke-width="2" stroke-linecap="round"/></svg>';

        const FLAG_EMOJI = '\u{1F6A7}';
        const BOMB_EMOJI = '\u{1F4A3}';
        const CROSS_EMOJI = '\u274C';

        let currentDiff = 0;
        let board = [];
        let rows, cols, totalMines;
        let revealed = [];
        let flagged = [];
        let gameOver = false;
        let firstClick = true;
        let timerInterval = null;
        let seconds = 0;
        let flagCount = 0;

        function setDifficulty(idx) {
            currentDiff = idx;
            document.querySelectorAll('.diff-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });
            initGame();
        }

        function initGame() {
            const diff = DIFFICULTIES[currentDiff];
            rows = diff.rows;
            cols = diff.cols;
            totalMines = diff.mines;

            board = [];
            revealed = [];
            flagged = [];
            gameOver = false;
            firstClick = true;
            flagCount = 0;
            seconds = 0;

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;

            for (let r = 0; r < rows; r++) {
                board[r] = [];
                revealed[r] = [];
                flagged[r] = [];
                for (let c = 0; c < cols; c++) {
                    board[r][c] = 0;
                    revealed[r][c] = false;
                    flagged[r][c] = false;
                }
            }

            updateUI();
            renderBoard();
            hideOverlay();
        }

        function placeMines(safeR, safeC) {
            let placed = 0;
            while (placed < totalMines) {
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * cols);
                if (board[r][c] === -1) continue;
                if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
                board[r][c] = -1;
                placed++;
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] === -1) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) {
                                count++;
                            }
                        }
                    }
                    board[r][c] = count;
                }
            }
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
            boardEl.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell hidden';
                    cell.dataset.r = r;
                    cell.dataset.c = c;

                    cell.addEventListener('click', () => handleClick(r, c));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(r, c);
                    });

                    boardEl.appendChild(cell);
                }
            }
        }

        function getCell(r, c) {
            return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
        }

        function handleClick(r, c) {
            if (gameOver || flagged[r][c] || revealed[r][c]) return;

            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
                startTimer();
            }

            if (board[r][c] === -1) {
                loseGame(r, c);
                return;
            }

            revealCell(r, c);
            checkWin();
        }

        function revealCell(r, c) {
            if (r < 0 || r >= rows || c < 0 || c >= cols) return;
            if (revealed[r][c] || flagged[r][c]) return;

            revealed[r][c] = true;
            const cell = getCell(r, c);
            cell.classList.remove('hidden');
            cell.classList.add('revealed');

            if (board[r][c] > 0) {
                cell.textContent = board[r][c];
                cell.classList.add('n' + board[r][c]);
            } else if (board[r][c] === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        revealCell(r + dr, c + dc);
                    }
                }
            }
        }

        function handleRightClick(r, c) {
            if (gameOver || revealed[r][c]) return;

            const cell = getCell(r, c);
            if (flagged[r][c]) {
                flagged[r][c] = false;
                flagCount--;
                cell.classList.remove('flagged');
                cell.innerHTML = '';
            } else {
                flagged[r][c] = true;
                flagCount++;
                cell.classList.add('flagged');
                cell.innerHTML = FLAG_SVG;
            }

            document.getElementById('mineCount').textContent = 'Mines: ' + (totalMines - flagCount);
        }

        function loseGame(explodedR, explodedC) {
            gameOver = true;
            if (timerInterval) clearInterval(timerInterval);

            const cell = getCell(explodedR, explodedC);
            cell.classList.remove('hidden');
            cell.classList.add('mine-exploded');
            cell.innerHTML = BOMB_SVG;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] === -1 && !(r === explodedR && c === explodedC)) {
                        const mc = getCell(r, c);
                        mc.classList.remove('hidden');
                        mc.classList.add('mine-shown');
                        if (!flagged[r][c]) {
                            mc.innerHTML = BOMB_SVG;
                        }
                    }
                    if (flagged[r][c] && board[r][c] !== -1) {
                        const mc = getCell(r, c);
                        mc.innerHTML = MISS_SVG;
                    }
                }
            }

            setTimeout(() => showModal(false), 500);
        }

        function checkWin() {
            let unrevealedSafe = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] !== -1 && !revealed[r][c]) {
                        unrevealedSafe++;
                    }
                }
            }

            if (unrevealedSafe === 0) {
                gameOver = true;
                if (timerInterval) clearInterval(timerInterval);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (board[r][c] === -1) {
                            flagged[r][c] = true;
                            const mc = getCell(r, c);
                            mc.innerHTML = FLAG_SVG;
                            mc.classList.add('flagged');
                        }
                    }
                }
                document.getElementById('mineCount').textContent = 'Mines: 0';
                setTimeout(() => showModal(true), 300);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('timer').textContent = 'Time: ' + seconds + 's';
            }, 1000);
        }

        function updateUI() {
            document.getElementById('mineCount').textContent = 'Mines: ' + totalMines;
            document.getElementById('timer').textContent = 'Time: 0s';
        }

        function showModal(isWin) {
            const overlay = document.getElementById('overlay');
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const msg = document.getElementById('modalMsg');

            modal.className = 'modal ' + (isWin ? 'win' : 'lose');
            title.textContent = isWin ? 'You Win!' : 'Game Over';
            msg.textContent = isWin ? 'Congratulations! Time: ' + seconds + 's' : 'Better luck next time!';

            overlay.classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        initGame();
    </script>
</body>
</html>
