<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - ArozOS</title>
    <link rel="stylesheet" href="css/arcade.css">
</head>
<body class="arcade">
    <div class="px-screen">

        <header class="px-frame px-glow px-header">
            <canvas class="px-header__scene" data-scene="header" aria-hidden="true"></canvas>
            <div class="px-header__body">
                <span class="px-sprite px-logo-badge" data-icon="art/robot" data-icon-label="ArozOS"></span>
                <div class="px-header__title">
                    <span class="px-text" data-px="Mini Games" data-px-scale="5"></span>
                    <div class="px-header__sub">Select a game to start playing!</div>
                </div>
                <span class="px-sprite px-deco px-deco--planet" data-icon="art/planet" aria-hidden="true"></span>
                <span class="px-sprite px-deco px-deco--rocket" data-icon="art/rocket" aria-hidden="true"></span>
                <div class="px-header__tools">
                    <span class="px-chip" title="Games played">
                        <span class="px-sprite" data-icon="ui/star" data-icon-label="Score"></span>
                        <b id="playCount">0</b>
                    </span>
                    <button class="px-btn px-btn--icon" id="helpBtn" type="button" title="How to play">
                        <span class="px-sprite" data-icon="ui/gear" data-icon-label="Help"></span>
                    </button>
                </div>
            </div>
        </header>

        <section class="px-frame px-panel">
            <div class="px-grid" id="gameGrid"></div>
        </section>

        <div class="px-footer">
            <canvas data-scene="moon" aria-hidden="true"></canvas>
            <span class="px-sprite px-footer__astro" data-icon="art/astronaut" aria-hidden="true"></span>
        </div>
    </div>

    <div class="overlay hidden" id="overlay">
        <div class="modal" id="modal">
            <h2>How to play</h2>
            <p>
                Pick any cabinet from the grid to start. Every game keeps its own
                high score in this browser, and the Back button in a game returns
                you here.
            </p>
            <button onclick="hideOverlay()">Got it</button>
        </div>
    </div>

    <script src="js/sprites.js"></script>
    <script src="js/arcade.js"></script>
    <script>
        /* The launcher line-up. "id" doubles as the sprite name and page name. */
        const GAMES = [
            { id: 'minesweeper', name: 'Minesweeper', desc: 'Find all the mines', art: 'mines/flag.png' },
            { id: 'tetris', name: 'Tetris', desc: 'Stack the blocks', art: 'tetris/piece.png' },
            { id: 'snake', name: 'Snake', desc: 'Classic snake game', art: 'snake/head.png' },
            { id: 'memory', name: 'Memory', desc: 'Match the pairs', art: 'memory/back.png' },
            { id: 'pong', name: 'Pong', desc: 'Classic pong game', art: 'pong/ball.png' },
            { id: 'space-invaders', name: 'Space Invaders', desc: 'Defend the earth', art: 'invaders/alien_b.png' },
            { id: 'asteroids', name: 'Asteroids', desc: 'Shoot space rocks', art: 'asteroids/ship.png' },
            { id: 'flappy-bird', name: 'Flappy Bird', desc: 'Flap through pipes', art: 'flappy/bird_a.png' },
            { id: 'dino-runner', name: 'Dino Runner', desc: 'Jump over cacti', art: 'dino/run_a.png' }
        ];

        const PLAY_COUNT_KEY = 'arozos.games.plays';

        function renderGrid() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            GAMES.forEach(function (game) {
                const card = document.createElement('div');
                card.className = 'px-frame px-card';
                card.tabIndex = 0;
                card.setAttribute('role', 'link');
                card.setAttribute('aria-label', game.name + ' - ' + game.desc);
                card.innerHTML =
                    '<img class="px-card__icon" src="img/sprites/' + game.art + '" alt="">' +
                    '<span class="px-text px-card__name" data-px="' + game.name + '" data-px-scale="2"></span>' +
                    '<span class="px-card__desc">' + game.desc + '</span>' +
                    '<span class="px-badge">Playable</span>';

                card.addEventListener('click', function () {
                    launch(game.id);
                });
                card.addEventListener('keydown', function (ev) {
                    if (ev.key === 'Enter' || ev.key === ' ') {
                        ev.preventDefault();
                        launch(game.id);
                    }
                });

                grid.appendChild(card);
            });

            pxUpgradeIcons(grid);
            pxUpgradeText(grid);
        }

        function launch(id) {
            try {
                const plays = parseInt(localStorage.getItem(PLAY_COUNT_KEY), 10) || 0;
                localStorage.setItem(PLAY_COUNT_KEY, plays + 1);
            } catch (err) {
                /* Private mode with storage disabled -- the counter is cosmetic. */
            }
            window.location.href = id + '.html';
        }

        function loadPlayCount() {
            let plays = 0;
            try {
                plays = parseInt(localStorage.getItem(PLAY_COUNT_KEY), 10) || 0;
            } catch (err) {
                plays = 0;
            }
            document.getElementById('playCount').textContent = plays;
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }

        document.getElementById('helpBtn').addEventListener('click', function () {
            document.getElementById('overlay').classList.remove('hidden');
        });

        renderGrid();
        loadPlayCount();
    </script>
</body>
</html>
