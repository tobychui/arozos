<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - ArozOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 560px;
            padding: 16px 0;
        }

        #backBtn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #backBtn:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        #backBtn svg {
            width: 16px;
            height: 16px;
        }

        #resetBtn {
            background: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #resetBtn:hover {
            transform: scale(1.1);
            border-color: rgba(255, 215, 0, 0.6);
        }

        #resetBtn svg {
            width: 20px;
            height: 20px;
        }

        .game-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        #gameCanvas {
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.5);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 16px;
            min-width: 140px;
        }

        .panel-box h3 {
            font-size: 0.85rem;
            color: #ffd700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat {
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            color: #ffd700;
            text-align: center;
            margin-bottom: 4px;
        }

        .controls {
            font-size: 0.8rem;
            color: #888888;
            line-height: 1.8;
        }

        .controls .key {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 1px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            min-width: 20px;
            text-align: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.hidden {
            display: none;
        }

        .modal {
            background: #141414;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            max-width: 300px;
        }

        .modal h2 {
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        .modal.lose h2 {
            color: #ff6432;
        }

        .modal p {
            margin-bottom: 20px;
            color: #888888;
        }

        .modal button {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 4px;
            transition: background 0.2s;
        }

        .modal button:hover {
            background: rgba(255, 215, 0, 0.3);
        }
    </style>
    <link rel="stylesheet" href="css/arcade.css">
</head>
<body class="arcade">
    <script src="js/sprites.js"></script>
    <script src="js/arcade.js"></script>
    <script src="js/gamekit.js"></script>
    <div class="top-bar">
        <button id="backBtn" onclick="goBack()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
        </button>
        <button id="resetBtn" onclick="initGame()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                <path d="M3 12C3 7.03 7.03 3 12 3C15.5 3 18.58 5 20 8" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
                <path d="M21 4V9H16" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 12C21 16.97 16.97 21 12 21C8.5 21 5.42 19 4 16" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
                <path d="M3 20V15H8" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <div class="game-layout">
        <canvas id="gameCanvas" width="440" height="440"></canvas>
        <div class="side-panel">
            <div class="panel-box">
                <h3>Score</h3>
                <div class="stat" id="score">0</div>
                <h3 style="margin-top:8px;">High Score</h3>
                <div class="stat" id="highScore">0</div>
            </div>
            <div class="panel-box">
                <h3>Controls</h3>
                <div class="controls">
                    <div><span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span> Move</div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="startOverlay">
        <div class="modal">
            <h2 data-gate-title>Game</h2>
            <p data-gate-hint></p>
            <button data-gate-start type="button">Start Game</button>
            <button type="button" onclick="goBack()">Back to Games</button>
        </div>
    </div>

    <div class="overlay hidden" id="overlay">
        <div class="modal" id="modal">
            <h2 id="modalTitle">Game Over</h2>
            <p id="modalMsg"></p>
            <button onclick="initGame()">Play Again</button>
            <button onclick="goBack(); hideOverlay();">Back to Games</button>
        </div>
    </div>

    <script>
        const CANVAS_SIZE = 440;
        const GRID_COUNT = 22;
        const CELL = CANVAS_SIZE / GRID_COUNT;
        const INITIAL_SPEED = 150;
        const SPEED_INCREMENT = 4;
        const MIN_SPEED = 60;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const art = GameKit.load({
            head: 'snake/head.png',
            head_open: 'snake/head_open.png',
            body: 'snake/body.png',
            tail: 'snake/tail.png',
            apple: 'snake/apple.png'
        }, function () {
            draw();
        });

        let snake = [];
        let food = null;
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
        let gameSpeed = INITIAL_SPEED;
        let gameOver = false;
        let running = false;
        let lastUpdate = 0;
        let animationId = null;

        document.getElementById('highScore').textContent = highScore;

        function initGame() {
            snake = [
                { x: 6, y: 11 },
                { x: 5, y: 11 },
                { x: 4, y: 11 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameSpeed = INITIAL_SPEED;
            gameOver = false;
            running = true;
            lastUpdate = 0;

            document.getElementById('score').textContent = '0';
            document.getElementById('overlay').classList.add('hidden');

            placeFood();

            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initGame();
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * GRID_COUNT),
                    y: Math.floor(Math.random() * GRID_COUNT)
                };
                valid = true;
                for (const segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function gameLoop(timestamp) {
            if (gameOver) return;

            if (running && timestamp - lastUpdate > gameSpeed) {
                update();
                lastUpdate = timestamp;
            }

            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function update() {
            direction = nextDirection;

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                endGame();
                return;
            }

            for (const segment of snake) {
                if (segment.x === head.x && segment.y === head.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                gameSpeed = Math.max(MIN_SPEED, INITIAL_SPEED - Math.floor(score / 30) * SPEED_INCREMENT);
                placeFood();
            } else {
                snake.pop();
            }
        }

        /* Sprites face right, so each segment is rotated onto its heading. */
        function drawRotated(img, gx, gy, dx, dy) {
            const cx = gx * CELL + CELL / 2;
            const cy = gy * CELL + CELL / 2;
            let angle = 0;
            if (dx === -1) angle = Math.PI;
            else if (dy === -1) angle = -Math.PI / 2;
            else if (dy === 1) angle = Math.PI / 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            GameKit.draw(ctx, img, -CELL / 2, -CELL / 2, CELL, CELL);
            ctx.restore();
        }

        function draw() {
            GameKit.pixelate(ctx);
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            for (let r = 0; r < GRID_COUNT; r++) {
                for (let c = 0; c < GRID_COUNT; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255, 255, 255, 0.02)' : 'rgba(255, 255, 255, 0.05)';
                    ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
                }
            }

            if (food) {
                GameKit.draw(ctx, art.apple, food.x * CELL + 1, food.y * CELL + 1, CELL - 2, CELL - 2);
            }

            for (let i = snake.length - 1; i >= 0; i--) {
                const seg = snake[i];
                if (i === 0) {
                    const mouthOpen = food &&
                        Math.abs(seg.x - food.x) + Math.abs(seg.y - food.y) <= 1;
                    drawRotated(mouthOpen ? art.head_open : art.head, seg.x, seg.y, direction.x, direction.y);
                } else if (i === snake.length - 1) {
                    const prev = snake[i - 1];
                    drawRotated(art.tail, seg.x, seg.y, prev.x - seg.x, prev.y - seg.y);
                } else {
                    GameKit.draw(ctx, art.body, seg.x * CELL, seg.y * CELL, CELL, CELL);
                }
            }
        }

        function endGame() {
            gameOver = true;
            running = false;

            if (score > highScore) {
                highScore = score;
                try {
                    localStorage.setItem('snakeHighScore', String(highScore));
                } catch (err) {
                    /* Storage disabled -- the high score is cosmetic. */
                }
                document.getElementById('highScore').textContent = highScore;
            }

            const modal = document.getElementById('modal');
            modal.className = 'modal lose';
            document.getElementById('modalTitle').textContent = 'Game Over';
            document.getElementById('modalMsg').textContent = 'Score: ' + score +
                (score >= highScore && score > 0 ? ' (New High Score!)' : '');
            document.getElementById('overlay').classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function handleKey(e) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) !== -1) {
                e.preventDefault();
            }
            if (!running) return;

            switch (e.key) {
                case 'ArrowUp':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        document.addEventListener('keydown', handleKey);

        GameKit.autoFit(canvas, { reserveH: 40 });
        GameKit.gate({
            title: 'Snake',
            hint: 'Steer with the arrow keys and eat the apples. The snake moves as soon as you start.',
            onStart: startGame
        });

        draw();
    </script>
</body>
</html>
