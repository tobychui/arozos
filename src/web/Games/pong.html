<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong - ArozOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 560px;
            padding: 16px 0;
        }

        #backBtn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #backBtn:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        #backBtn svg {
            width: 16px;
            height: 16px;
        }

        #resetBtn {
            background: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #resetBtn:hover {
            transform: scale(1.1);
            border-color: rgba(255, 215, 0, 0.6);
        }

        #resetBtn svg {
            width: 20px;
            height: 20px;
        }

        .game-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        #gameCanvas {
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.5);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 16px;
            min-width: 140px;
        }

        .panel-box h3 {
            font-size: 0.85rem;
            color: #ffd700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat {
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            color: #ffd700;
            text-align: center;
            margin-bottom: 4px;
        }

        .controls {
            font-size: 0.8rem;
            color: #888888;
            line-height: 1.8;
        }

        .controls .key {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 1px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            min-width: 20px;
            text-align: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.hidden {
            display: none;
        }

        .modal {
            background: #141414;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            max-width: 300px;
        }

        .modal h2 {
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        .modal.win h2 {
            color: #4caf50;
        }

        .modal.lose h2 {
            color: #ff6432;
        }

        .modal p {
            margin-bottom: 20px;
            color: #888888;
        }

        .modal button {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 4px;
            transition: background 0.2s;
        }

        .modal button:hover {
            background: rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button id="backBtn" onclick="goBack()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
        </button>
        <button id="resetBtn" onclick="initGame()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                <path d="M3 12C3 7.03 7.03 3 12 3C15.5 3 18.58 5 20 8" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
                <path d="M21 4V9H16" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 12C21 16.97 16.97 21 12 21C8.5 21 5.42 19 4 16" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
                <path d="M3 20V15H8" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="game-info">
            <span id="score">0</span>
        </div>
    </div>

    <div class="game-layout">
        <canvas id="gameCanvas" width="480" height="360"></canvas>
        <div class="side-panel">
            <div class="panel-box">
                <h3>Score</h3>
                <div class="stat" id="scoreDisplay">0</div>
                <h3 style="margin-top:8px;">High Score</h3>
                <div class="stat" id="highScore">0</div>
            </div>
            <div class="panel-box">
                <h3>Controls</h3>
                <div class="controls">
                    <div><span class="key">↑</span> <span class="key">↓</span> Move paddle</div>
                    <div>Mouse: Move paddle</div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="overlay">
        <div class="modal" id="modal">
            <h2 id="modalTitle"></h2>
            <p id="modalMsg"></p>
            <button onclick="initGame()">Play Again</button>
            <button onclick="goBack(); hideOverlay();">Back to Games</button>
        </div>
    </div>

    <script>
        const CANVAS_WIDTH = 480;
        const CANVAS_HEIGHT = 360;
        const PADDLE_WIDTH = 12;
        const PADDLE_HEIGHT = 60;
        const BALL_SIZE = 8;
        const WIN_SCORE = 5;
        const PADDLE_SPEED = 6;
        const INITIAL_BALL_SPEED = 3;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let playerY = CANVAS_HEIGHT / 2 - PADDLE_HEIGHT / 2;
        let aiY = CANVAS_HEIGHT / 2 - PADDLE_HEIGHT / 2;
        let ballX = CANVAS_WIDTH / 2;
        let ballY = CANVAS_HEIGHT / 2;
        let ballDX = INITIAL_BALL_SPEED;
        let ballDY = INITIAL_BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
        let score = 0;
        let highScore = parseInt(localStorage.getItem('pongHighScore') || '0');
        let gameOver = false;
        let gameStarted = false;
        let animationId = null;

        document.getElementById('highScore').textContent = highScore;

        function initGame() {
            playerY = CANVAS_HEIGHT / 2 - PADDLE_HEIGHT / 2;
            aiY = CANVAS_HEIGHT / 2 - PADDLE_HEIGHT / 2;
            resetBall();
            score = 0;
            gameOver = false;
            gameStarted = false;

            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('overlay').classList.add('hidden');

            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(gameLoop);
        }

        function resetBall() {
            ballX = CANVAS_WIDTH / 2;
            ballY = CANVAS_HEIGHT / 2;
            ballDX = INITIAL_BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
            ballDY = INITIAL_BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
        }

        function gameLoop() {
            if (gameOver) return;

            update();
            draw();

            animationId = requestAnimationFrame(gameLoop);
        }

        function update() {
            if (!gameStarted) return;

            ballX += ballDX;
            ballY += ballDY;

            if (ballY <= 0 || ballY >= CANVAS_HEIGHT - BALL_SIZE) {
                ballDY = -ballDY;
            }

            if (ballX <= PADDLE_WIDTH + 10 && ballY >= playerY && ballY <= playerY + PADDLE_HEIGHT) {
                ballDX = Math.abs(ballDX);
                const hitPos = (ballY - playerY) / PADDLE_HEIGHT;
                ballDY = INITIAL_BALL_SPEED * (0.5 + hitPos) * (Math.random() > 0.5 ? 1 : -1);
                ballDX += 0.5;
            }

            if (ballX >= CANVAS_WIDTH - PADDLE_WIDTH - BALL_SIZE - 10 && ballY >= aiY && ballY <= aiY + PADDLE_HEIGHT) {
                ballDX = -Math.abs(ballDX);
                const hitPos = (ballY - aiY) / PADDLE_HEIGHT;
                ballDY = INITIAL_BALL_SPEED * (0.5 + hitPos) * (Math.random() > 0.5 ? 1 : -1);
            }

            if (ballX < 0) {
                endGame(false);
                return;
            }

            if (ballX > CANVAS_WIDTH) {
                score++;
                document.getElementById('scoreDisplay').textContent = score;
                if (score >= WIN_SCORE) {
                    endGame(true);
                    return;
                }
                resetBall();
            }

            const aiTarget = ballY - PADDLE_HEIGHT / 2;
            const aiDiff = aiTarget - aiY;
            aiY += Math.sign(aiDiff) * Math.min(Math.abs(aiDiff), PADDLE_SPEED * 0.7);
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(CANVAS_WIDTH / 2, 0);
            ctx.lineTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#ffd700';
            ctx.fillRect(10, playerY, PADDLE_WIDTH, PADDLE_HEIGHT);

            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.fillRect(CANVAS_WIDTH - 10 - PADDLE_WIDTH, aiY, PADDLE_WIDTH, PADDLE_HEIGHT);

            ctx.fillStyle = '#ffd700';
            ctx.fillRect(ballX, ballY, BALL_SIZE, BALL_SIZE);

            if (!gameStarted) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 18px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText('Press any key or click to start', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
            }
        }

        function endGame(isWin) {
            gameOver = true;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('pongHighScore', highScore.toString());
                document.getElementById('highScore').textContent = highScore;
            }

            const overlay = document.getElementById('overlay');
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const msg = document.getElementById('modalMsg');

            modal.className = 'modal ' + (isWin ? 'win' : 'lose');
            title.textContent = isWin ? 'You Win!' : 'Game Over';
            msg.textContent = 'Score: ' + score + ' | High Score: ' + highScore;

            overlay.classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
        }

        function handleKey(e) {
            if (['ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) {
                e.preventDefault();
            }

            if (gameOver) return;

            startGame();

            switch (e.key) {
                case 'ArrowUp':
                    playerY = Math.max(0, playerY - 20);
                    break;
                case 'ArrowDown':
                    playerY = Math.min(CANVAS_HEIGHT - PADDLE_HEIGHT, playerY + 20);
                    break;
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            if (gameOver) return;
            startGame();

            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            playerY = Math.max(0, Math.min(CANVAS_HEIGHT - PADDLE_HEIGHT, mouseY - PADDLE_HEIGHT / 2));
        });

        canvas.addEventListener('click', () => {
            if (gameOver) return;
            startGame();
        });

        document.addEventListener('keydown', handleKey);
        initGame();
    </script>
</body>
</html>
