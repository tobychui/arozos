<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000">
    <title locale="viewer/pageTitle">Photo Viewer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="embedded/viewer.css">
    <script src="../script/jquery.min.js"></script>
    <script src="../script/ao_module.js"></script>
    <script src="../script/applocale.js"></script>
    <script src="i18n.js"></script>
    <script src="constants.js"></script>
    <script src="embedded/js/icons.js"></script>
    <script src="embedded/js/geometry.js"></script>
    <script src="embedded/js/renderer.js"></script>
    <script src="embedded/js/ruler.js"></script>
</head>
<body>
    <div id="app" class="viewing portrait">
        <!-- editor: top tools -->
        <div id="eTop" class="echrome">
            <div class="eCorner left"><span class="slot" id="slotCancel"></span><div class="eTopGroup left" id="eTopLeft"></div></div>
            <span class="slot" id="slotTabs"></span>
            <button class="ePill" id="ePill" type="button"></button>
            <div class="eCorner right"><span class="slot" id="slotPill"></span><div class="eTopGroup right" id="eTopRight"></div><span class="slot" id="slotDone"></span></div>
        </div>

        <div id="stage">
            <img id="viewImg" alt="" draggable="false">
            <canvas id="editCanvas"></canvas>
            <div id="cropFrame">
                <div class="grid"></div>
                <div class="ce t" data-h="t"></div><div class="ce b" data-h="b"></div>
                <div class="ce l" data-h="l"></div><div class="ce r" data-h="r"></div>
                <div class="ch tl" data-h="tl"></div><div class="ch tr" data-h="tr"></div>
                <div class="ch bl" data-h="bl"></div><div class="ch br" data-h="br"></div>
            </div>
            <div class="spinner" id="spinner"></div>
            <button class="navArrow left" id="navPrev" type="button" title="Previous"></button>
            <button class="navArrow right" id="navNext" type="button" title="Next"></button>
        </div>

        <!-- viewer chrome -->
        <header id="vTop" class="vchrome">
            <div class="vTitle"><b id="vName"></b><span id="vDate"></span></div>
            <span id="vCount"></span>
            <span class="slot" id="slotActions"></span>
        </header>
        <div id="vBottom" class="vchrome">
            <div id="vStrip" class="hidden"></div>
            <div id="vBar">
                <button type="button" id="btnShare" title="Download"><span class="ic"></span></button>
                <button type="button" id="btnInfo" title="Info (I)"><span class="ic"></span></button>
                <button type="button" id="btnEdit" title="Edit (E)"><span class="ic"></span><span class="tl" locale="viewer/edit">Edit</span></button>
            </div>
        </div>

        <!-- editor: tools under / beside the picture -->
        <div id="ePanel" class="echrome">
            <div id="eLabel"></div>
            <div id="eCarousel"></div>
            <div id="eRulerWrap"><div id="eRuler"></div></div>
        </div>
        <div id="eBar" class="echrome">
            <button type="button" class="eText cancel" id="btnCancel" locale="common/cancel">Cancel</button>
            <div class="eTabs">
                <button type="button" class="eTab" data-tab="adjust" title="Adjust"><span class="ic"></span><span class="tl" locale="viewer/adjust">Adjust</span></button>
                <button type="button" class="eTab" data-tab="filters" title="Filters"><span class="ic"></span><span class="tl" locale="viewer/filters">Filters</span></button>
                <button type="button" class="eTab" data-tab="crop" title="Crop"><span class="ic"></span><span class="tl" locale="viewer/crop">Crop</span></button>
            </div>
            <button type="button" class="eText done" id="btnDone" locale="viewer/done">Done</button>
        </div>
    </div>

    <div id="sheetBackdrop"></div>
    <div id="infoSheet" class="sheet" role="dialog" aria-label="Photo information"></div>
    <div id="dialog" class="dlg" role="dialog" aria-modal="true"></div>
    <div id="actionSheet" class="sheet" role="dialog"></div>
    <div id="toast" role="status"></div>
    <div id="progress"><div class="box"><div class="spinner"></div><span id="progressText" locale="save/saving">Saving</span></div></div>

    <script src="embedded/js/editor.js"></script>
    <script src="embedded/js/viewer.js"></script>
</body>
</html>
