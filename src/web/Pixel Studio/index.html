<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Studio</title>
    <link rel="icon" href="img/module_icon.png">
    <script src="../script/jquery.min.js"></script>
    <script src="../script/ao_module.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top menu bar -->
    <div id="menubar"></div>

    <!-- Tool options bar (content depends on the active tool) -->
    <div id="optionsbar"></div>

    <div id="main">
        <!-- Left tool bar -->
        <div id="toolbar">
            <div id="toolbar-buttons"></div>
            <div id="color-wells" title="Foreground / background color (X to swap, D to reset)">
                <div id="bg-well"></div>
                <div id="fg-well"></div>
                <input type="color" id="fg-input">
                <input type="color" id="bg-input">
            </div>
            <div id="toolbar-modes">
                <button id="quickmask-btn" type="button" title="Edit in Quick Mask Mode (Q)">
                    <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1"/><circle cx="12" cy="12" r="3.6" class="qm-dot"/></svg>
                </button>
                <button id="screenmode-btn" type="button" title="Standard Screen Mode (F)">
                    <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1"/><rect x="6.5" y="8.5" width="11" height="7"/></svg>
                </button>
            </div>
        </div>

        <!-- Center workspace -->
        <div id="workspace-holder">
            <div id="workspace">
                <div id="canvas-wrap">
                    <div id="canvas-positioner">
                        <canvas id="doc-canvas" width="1" height="1"></canvas>
                    </div>
                </div>
            </div>
            <canvas id="overlay-canvas"></canvas>
            <div id="text-edit-host"></div>
            <canvas id="ruler-top" title="Drag down to add a horizontal guide"></canvas>
            <canvas id="ruler-left" title="Drag right to add a vertical guide"></canvas>
            <div id="ruler-corner"></div>
        </div>

        <!-- Right panel dock (workspace.js builds the panel groups) -->
        <div id="dock">
            <div id="dock-resizer" title="Drag to resize the panels"></div>
            <div id="dock-icons"></div>
            <div id="dock-main"></div>
        </div>
    </div>

    <!-- Bottom status bar -->
    <div id="statusbar">
        <span id="status-doc"></span>
        <span id="status-pos"></span>
        <span id="status-hint"></span>
        <span class="spacer"></span>
        <span id="status-save"></span>
        <select id="status-zoom">
            <option value="0.125">12.5%</option>
            <option value="0.25">25%</option>
            <option value="0.5">50%</option>
            <option value="1" selected>100%</option>
            <option value="2">200%</option>
            <option value="4">400%</option>
            <option value="8">800%</option>
            <option value="fit">Fit</option>
        </select>
    </div>

    <div id="dialog-host"></div>
    <div id="toast-host"></div>

    <script src="js/editor.js"></script>
    <script src="js/cursors.js"></script>
    <script src="js/workspace.js"></script>
    <script src="js/model.js"></script>
    <script src="js/compositor.js"></script>
    <script src="js/transform.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/adjust.js"></script>
    <script src="js/vector.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/layerstyle.js"></script>
    <script src="js/colorpicker.js"></script>
    <script src="js/history.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/selection.js"></script>
    <script src="js/guides.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/brushes.js"></script>
    <script src="js/measure.js"></script>
    <script src="js/gradient.js"></script>
    <script src="js/text.js"></script>
    <script src="js/typetools.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/retouch.js"></script>
    <script src="js/docio.js"></script>
    <script src="js/savemanager.js"></script>
    <script src="js/fileio.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/panels.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/hotkeys.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
