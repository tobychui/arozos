<!DOCTYPE html>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1"/>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="theme-color" content="#232324">
    <link rel="stylesheet" href="../script/semantic/semantic.min.css">
	<link rel="icon" type="image/png" href="./img/module_icon.png">
	<script src="../script/jquery.min.js"></script>
	<script src="../script/semantic/semantic.min.js"></script>
	<script src="../script/ao_module.js"></script>
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		/* Colours follow the Drive music player: a dark blue-grey stage under
		   the blurred cover art, grey stroked icons, a white play disc and a
		   blue accent for the progress and the active toggles. */
		:root {
			--stage:   #171c26;
			--panel:   #121722;
			--line:    rgba(255,255,255,.08);
			--accent:  #5b93ff;
			--text:    #e8ecf3;
			--text2:   #9aa4b5;
			--text3:   #6d7789;
			--hover:   rgba(255,255,255,.12);
		}
		html, body {
			height: 100%; overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			font-size: 13px;
			background: transparent !important;
			color: var(--text);
		}
		body { display: flex; flex-direction: column; }
		button { font: inherit; }
		.ic { width: 18px; height: 18px; display: block; flex: none; }

		/* ── Player card ─────────────────────────────────────────────── */
		#playerCard {
			position: relative;
			flex-shrink: 0;
			overflow: hidden;
			height: 224px;
			background: var(--stage);
		}
		.bg-blur {
			position: absolute; inset: -40px;
			background-size: cover; background-position: center;
			filter: blur(36px) saturate(1.4);
			transform: scale(1.1);
			transition: background-image 0.6s ease;
			z-index: 0;
			opacity: .38;
			pointer-events: none;
		}
		.player-inner {
			position: relative; z-index: 1;
			padding: 13px 14px 10px;
			display: flex; flex-direction: column; gap: 5px;
		}

		/* Cover + meta */
		.cover-meta { display: flex; align-items: center; gap: 12px; }
		#coverArt {
			width: 60px; height: 60px; border-radius: 10px;
			object-fit: cover; flex-shrink: 0;
			background: #222936;
			box-shadow: 0 8px 24px rgba(0,0,0,.55);
		}
		.meta-col { flex: 1; min-width: 0; }
		#songTitle {
			font-size: 13.5px; font-weight: 700; color: var(--text); letter-spacing: -.1px;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}
		#artistLabel {
			font-size: 11.5px; color: var(--text2);
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
			margin-top: 2px;
		}
		#fileSize { font-size: 10px; color: var(--text3); margin-top: 2px; }

		/* Seek: a 4 px track that thickens on hover, knob only while pointing */
		.seek-row { display: flex; align-items: center; gap: 8px; }
		.t { font-size: 10.5px; color: var(--text2); white-space: nowrap; min-width: 26px; font-variant-numeric: tabular-nums; }
		.t.right { text-align: right; }
		#seekBar {
			--track: 4px;
			flex: 1; -webkit-appearance: none; appearance: none;
			height: 23px; outline: none; cursor: pointer; background: transparent;
		}
		#seekBar:hover, #seekBar:active { --track: 6px; }
		#seekBar::-webkit-slider-runnable-track {
			height: var(--track); border-radius: 3px;
			background: linear-gradient(to right,
				var(--accent) 0%, var(--accent) var(--progress, 0%),
				rgba(255,255,255,.22) var(--progress, 0%), rgba(255,255,255,.22) 100%);
		}
		#seekBar::-webkit-slider-thumb {
			-webkit-appearance: none; width: 12px; height: 12px; border: 0;
			border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
			margin-top: calc((var(--track) - 12px) / 2);
			transform: scale(0); transition: transform .12s;
		}
		#seekBar:hover::-webkit-slider-thumb, #seekBar:active::-webkit-slider-thumb { transform: scale(1); }
		#seekBar::-moz-range-track { height: var(--track); border-radius: 3px; background: rgba(255,255,255,.22); }
		#seekBar::-moz-range-progress { height: var(--track); border-radius: 3px; background: var(--accent); }
		#seekBar::-moz-range-thumb {
			width: 12px; height: 12px; border: 0; border-radius: 50%;
			background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
			transform: scale(0); transition: transform .12s;
		}
		#seekBar:hover::-moz-range-thumb, #seekBar:active::-moz-range-thumb { transform: scale(1); }

		/* Controls */
		.controls {
			display: flex; align-items: center; justify-content: space-between;
		}
		.ctrl-btn {
			background: none; border: none; cursor: pointer;
			color: var(--text2);
			width: 34px; height: 34px; border-radius: 50%;
			display: flex; align-items: center; justify-content: center;
			position: relative; flex: none;
			transition: color .12s, background .12s, transform .12s;
		}
		.ctrl-btn:hover { color: #fff; background: var(--hover); }
		.ctrl-btn.active { color: var(--accent); }
		.ctrl-btn.play-btn {
			background: #fff; color: #111620;
			width: 40px; height: 40px;
			box-shadow: 0 6px 18px rgba(0,0,0,.35);
		}
		.ctrl-btn.play-btn:hover { background: #fff; color: #111620; transform: scale(1.04); }
		#playIcon { display: flex; align-items: center; justify-content: center; }
		.ctrl-btn.play-btn .ic { width: 20px; height: 20px; }
		.ctrl-btn.play-btn i.icon { margin: 0; font-size: 15px; line-height: 1; height: auto; }

		/* Volume */
		.vol-row { display: flex; align-items: center; gap: 6px; }
		.vol-icon {
			color: var(--text2); cursor: pointer;
			width: 22px; height: 22px; border-radius: 6px;
			flex-shrink: 0; display: flex; align-items: center; justify-content: center;
			transition: color .12s;
		}
		.vol-icon:hover { color: #fff; }
		.vol-icon .ic { width: 16px; height: 16px; }
		#volBar {
			flex: 1; -webkit-appearance: none; appearance: none;
			height: 23px; outline: none; cursor: pointer; background: transparent;
		}
		#volBar::-webkit-slider-runnable-track {
			height: 4px; border-radius: 2px;
			background: linear-gradient(to right,
				#fff 0%, #fff var(--vol, 60%),
				rgba(255,255,255,.25) var(--vol, 60%), rgba(255,255,255,.25) 100%);
		}
		#volBar::-webkit-slider-thumb {
			-webkit-appearance: none; width: 12px; height: 12px; border: 0;
			border-radius: 50%; background: #fff; margin-top: -4px;
		}
		#volBar::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }
		#volBar::-moz-range-progress { height: 4px; border-radius: 2px; background: #fff; }
		#volBar::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }

		/* Action buttons */
		.action-row { display: flex; gap: 6px; margin-top: 0;}
		.act-btn {
			flex: 1; padding: 5px 8px;
			background: rgba(255,255,255,.05); border: 1px solid var(--line);
			border-radius: 9px; color: var(--text);
			font-size: 11.5px; font-weight: 600; cursor: pointer;
			display: flex; align-items: center; justify-content: center; gap: 6px;
			transition: background .12s, color .12s, border-color .12s;
		}
		.act-btn:hover { background: var(--hover); border-color: rgba(255,255,255,.16); color: #fff; }
		.act-btn .ic { width: 14px; height: 14px; color: var(--text2); }

		/* Song list */
		#songList {
			flex: 1; overflow-y: auto; overflow-x: hidden;
			background: var(--panel);
			border-top: 1px solid var(--line);
			padding: 4px 6px 8px;
			scrollbar-width: thin;
			scrollbar-color: rgba(255,255,255,.16) transparent;
		}
		#songList::-webkit-scrollbar { width: 8px; }
		#songList::-webkit-scrollbar-thumb {
			background: rgba(255,255,255,.16); border-radius: 8px;
			border: 2px solid transparent; background-clip: padding-box;
		}
		.list-item {
			display: flex; align-items: center; gap: 10px;
			padding: 6px 8px; cursor: pointer;
			border-radius: 9px;
			color: var(--text); font-size: 12px;
			transition: background .1s;
		}
		.list-item:hover { background: rgba(255,255,255,.08); }
		.list-item.selected { background: rgba(59,124,246,.16); color: var(--accent); }
		.list-item img {
			width: 30px; height: 30px; border-radius: 6px;
			object-fit: cover; flex-shrink: 0; background: #222936;
		}
		.list-item .li-name {
			flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}
		.list-item .li-size { font-size: 10.5px; color: var(--text3); flex-shrink: 0; }
	</style>
</head>
<body>
	<!-- Player card -->
	<div id="playerCard">
		<div class="bg-blur" id="bgBlur"></div>
		<div class="player-inner">
			<!-- Cover + metadata -->
			<div class="cover-meta">
				<img id="coverArt" src="img/placeholder.png" alt="cover"
				     onerror="this.src='img/placeholder.png';this.onerror=null;">
				<div class="meta-col">
					<div id="songTitle">Loading…</div>
					<div id="artistLabel"></div>
					<div id="fileSize"></div>
				</div>
			</div>

			<!-- Seek bar -->
			<div class="seek-row">
				<span class="t" id="timeCurrent">0:00</span>
				<input type="range" id="seekBar" min="0" max="100" value="0">
				<span class="t right" id="timeTotal">0:00</span>
			</div>

			<!-- Playback controls -->
			<div class="controls">
				<button class="ctrl-btn" id="shuffleBtn" title="Shuffle" onclick="toggleShuffle()">
					<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 4.6c1.1 1.7 2.3 2.7 4.3 2.7H21"/><path d="M3 17h3.5c1.4 0 2.4-.5 3.2-1.4M14.3 8.4c.8-.9 1.8-1.4 3.2-1.4H21"/><path d="M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/></svg>
				</button>
				<button class="ctrl-btn" title="Previous" onclick="prevSong()">
					<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM19 5.5v13l-9.5-6.5z"/></svg>
				</button>
				<button class="ctrl-btn play-btn" id="playBtn" title="Play / Pause" onclick="togglePlay()">
					<span id="playIcon"></span>
				</button>
				<button class="ctrl-btn" title="Next" onclick="nextSong()">
					<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5.5v13l9.5-6.5z"/></svg>
				</button>
				<button class="ctrl-btn" id="repeatBtn" title="Repeat: off" onclick="cycleRepeat()"></button>
			</div>

			<!-- Volume -->
			<div class="vol-row">
				<span class="vol-icon" id="volIconEl" onclick="toggleMute()" title="Mute"></span>
				<input type="range" id="volBar" min="0" max="100" value="60" aria-label="Volume">
			</div>

			<!-- Action row -->
			<div class="action-row">
				<button class="act-btn" onclick="openInMusicify()" title="Open folder in Musicify">
					<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span>Open in Musicify</span>
				</button>
				<button class="act-btn" id="listToggleBtn" onclick="toggleList()">
					<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg><span id="listBtnLabel">Show List</span>
				</button>
			</div>
		</div>
	</div>

	<!-- Scrollable song list -->
	<div id="songList">
		<div class="list-item" style="justify-content:center;padding:14px;">
			<i class="ui loading spinner icon" style="margin:0;"></i>
		</div>
	</div>

	<audio id="mainPlayer" preload="auto" autoplay style="display:none;"></audio>

	<script>
		var player      = document.getElementById('mainPlayer');
		var songInfo    = null;   // current song object {filepath, name, ext, hsize}
		var songList    = [];     // songs in current directory
		var shuffledList = [];
		var mediaExchanging = false;
		var listShown   = !ao_module_virtualDesktop;
		var shuffleMode = false;
		var repeatMode  = 'none'; // 'none' | 'all' | 'one'
		var isMuted     = false;
		var savedVol    = 0;

		// ── Icons (the stroked 24px set of the Drive music player) ────────
		function strokeIcon(body) {
			return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
				'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
		}
		var ICON_PLAY  = strokeIcon('<path d="M8 5.5v13l10-6.5z"/>');
		var ICON_PAUSE = strokeIcon('<path d="M9 6v12M15 6v12"/>');

		function repeatIconSVG(mode) {
			return strokeIcon('<path d="M4 11V9a3 3 0 0 1 3-3h12"/><path d="M16 3l3 3-3 3"/>' +
				'<path d="M20 13v2a3 3 0 0 1-3 3H5"/><path d="M8 21l-3-3 3-3"/>' +
				(mode === 'one' ? '<text x="12" y="14.6" text-anchor="middle" font-size="7.5" font-weight="700" ' +
					'fill="currentColor" stroke="none" font-family="Segoe UI,Arial,sans-serif">1</text>' : ''));
		}

		function volumeIconSVG(fraction) {
			var waves = fraction === 0 ? '<path d="M16 9.5l5 5M21 9.5l-5 5"/>' :
				fraction < 0.5 ? '<path d="M15.5 9.2a4 4 0 0 1 0 5.6"/>' :
				'<path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.3 6.6a7.6 7.6 0 0 1 0 10.8"/>';
			return strokeIcon('<path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor"/>' + waves);
		}

		// ── Safari fallback: full-buffer 48kHz transcode ─────────────────────
		// Safari's <audio> element can silently get stuck on some formats it
		// claims to support (FLAC especially: some files decode fine, others
		// just hang with currentTime frozen at 0 and no 'error' event to catch
		// it). Rather than risk a stuck player, formats known to be unreliable
		// on Safari are routed through the same whole-track 48kHz MP3 buffer
		// endpoint the full Musicify desktop UI already uses for iOS. A
		// completed buffered file behaves like any native source afterwards.
		var FULLBUFFER_EXTS = ['flac', 'ogg', 'wma', 'webm', 'opus'];
		var currentPlayingFilepath = null; // set as soon as playback is requested
		var fullBufferAttempted    = false; // guards against retry loops

		function isSafariBrowser() {
			var ua = navigator.userAgent;
			return /^((?!chrome|android|crios|fxios|edg\/).)*safari/i.test(ua);
		}

		function extOf(filepath) {
			return (filepath.split('.').pop() || '').toLowerCase();
		}

		function needsFullBuffer(filepath) {
			return isSafariBrowser() && FULLBUFFER_EXTS.indexOf(extOf(filepath)) !== -1;
		}

		// Single entry point for pointing the player at a track. Routes through
		// the full-buffer transcode first when native playback is expected to
		// get stuck; otherwise plays the file directly as before.
		function setSource(filepath, autoplay) {
			currentPlayingFilepath = filepath;
			fullBufferAttempted = false;
			if (needsFullBuffer(filepath)) {
				loadViaFullBuffer(filepath, autoplay);
			} else {
				player.src = ao_root + 'media?file=' + encodeURIComponent(filepath);
				player.load();
				if (autoplay) player.play().catch(function() {});
			}
		}

		// Requests a whole-track 48kHz MP3 from the shared fullbuffer.js backend
		// and plays that instead of the raw source file once it is ready.
		function loadViaFullBuffer(filepath, autoplay) {
			fullBufferAttempted = true;
			setBuffering(true);
			player.pause();
			fetch(ao_root + 'system/ajgi/interface?script=Musicify/backend/fullbuffer.js', {
				method: 'POST', cache: 'no-cache',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ file: filepath, samplerate: '48' })
			}).then(function(r) { return r.json(); }).then(function(data) {
				if (currentPlayingFilepath !== filepath) return; // user moved on
				setBuffering(false);
				player.src = (data && data.path && !data.error) ?
					ao_root + 'media?file=' + encodeURIComponent(data.path) :
					ao_root + 'media?file=' + encodeURIComponent(filepath);
				player.load();
				if (autoplay) player.play().catch(function() {});
			}).catch(function() {
				if (currentPlayingFilepath !== filepath) return;
				setBuffering(false);
				player.src = ao_root + 'media?file=' + encodeURIComponent(filepath);
				player.load();
				if (autoplay) player.play().catch(function() {});
			});
		}

		// Shows a spinner in place of the play/pause icon while a full-buffer
		// transcode is in flight, since it can take a few seconds for a whole
		// track — without this the player looks stuck in the exact way this
		// fallback exists to avoid.
		function setBuffering(isBuffering) {
			if (isBuffering) {
				document.getElementById('playIcon').innerHTML = '<i class="notched circle loading icon"></i>';
			} else {
				syncPlayIcon();
			}
		}

		// ── Startup ───────────────────────────────────────────────────────
		ao_module_setFixedWindowSize();
		ao_module_setWindowSize(360, 254);

		// Restore volume
		var storedVol = localStorage.getItem('global_volume');
		var initVol   = storedVol !== null ? parseFloat(storedVol) : 0.6;
		player.volume = Math.max(0, Math.min(1, isNaN(initVol) ? 0.6 : initVol));
		setVolumeUI(player.volume);
		syncPlayIcon();
		updateRepeatUI();

		// Restore prefs from server (cross-device sync)
		ao_module_storage.loadStorage("Musicify", "emb_repeat", function(val) {
			if (val === 'all' || val === 'one') repeatMode = val;
			updateRepeatUI();
		});
		ao_module_storage.loadStorage("Musicify", "emb_shuffle", function(val) {
			if (val !== null && val !== undefined) shuffleMode = (val === 'true');
			updateShuffleUI();
		});

		// Read input file passed by File Manager / ao_module_openWith
		var inputFiles  = ao_module_loadInputFiles();
		var playingFile = inputFiles ? inputFiles[0] : null;

		if (!playingFile || !playingFile.filepath) {
			document.getElementById('songTitle').textContent = 'No file selected';
			document.getElementById('songList').innerHTML = '';
		} else {
			// Set src immediately for fast startup
			setSource(playingFile.filepath, true);
			var displayName = playingFile.filename || playingFile.filepath.split('/').pop();
			ao_module_setWindowTitle(displayName);
			document.getElementById('songTitle').textContent = displayName;

			// Load folder listing via Musicify backend
			var folderPath = playingFile.filepath.split('/').slice(0, -1).join('/');
			loadFolder(folderPath, playingFile.filepath);
		}

		updateListVisibility();

		// ── Folder / song-list loading ────────────────────────────────────
		function loadFolder(folder, targetFilepath) {
			ao_module_agirun('Musicify/backend/listFolder.js',
				{ folder: encodeURIComponent(folder) },
				function(data) {
					if (typeof data === 'string') {
						try { data = JSON.parse(data); } catch(e) { return; }
					}
					if (!data || !data.songs) return;

					songList = data.songs;
					buildShuffledList();
					renderSongList();

					// Locate the initially-playing song
					for (var i = 0; i < songList.length; i++) {
						if (songList[i].filepath === targetFilepath) {
							songInfo = songList[i]; break;
						}
					}
					// Fallback: match by filename only
					if (!songInfo) {
						var targetBase = targetFilepath.split('/').pop();
						for (var i = 0; i < songList.length; i++) {
							if (songList[i].filepath.split('/').pop() === targetBase) {
								songInfo = songList[i]; break;
							}
						}
					}
					if (songInfo) { updatePlayerMeta(songInfo); highlightSelected(); }
				}
			);
		}

		function renderSongList() {
			var container = document.getElementById('songList');
			container.innerHTML = '';
			for (var i = 0; i < songList.length; i++) {
				(function(song) {
					var div = document.createElement('div');
					div.className = 'list-item';
					div.setAttribute('data-filepath', song.filepath);
					div.innerHTML =
						'<img src="' + getCoverUrl(song) + '" alt="" ' +
						'onerror="this.src=\'img/placeholder.png\';this.onerror=null;" loading="lazy">' +
						'<span class="li-name">' + escHtml(song.name) + '</span>' +
						'<span class="li-size">' + escHtml(song.hsize) + '</span>';
					div.addEventListener('click', function() { loadSong(song); });
					container.appendChild(div);
				})(songList[i]);
			}
			highlightSelected();
		}

		// ── Player meta ───────────────────────────────────────────────────
		// Off-screen probe used to test whether a thumbnail URL actually loads.
		// Keeping a module-level reference lets us cancel stale probes when the
		// user clicks a different song before the previous image finished loading.
		var _coverProbe = null;

		function updatePlayerMeta(song) {
			document.getElementById('songTitle').textContent   = song.name;
			document.getElementById('artistLabel').textContent = getArtistLabel(song);
			document.getElementById('fileSize').textContent    =
				song.ext.toUpperCase() + ' · ' + song.hsize;
			let url     = getCoverUrl(song);
			let coverEl = document.getElementById('coverArt');
			let bgBlur  = document.getElementById('bgBlur');

			// Discard any in-flight probe from a previous call so its callbacks
			// can never overwrite the state set by this (newer) call.
			if (_coverProbe) { _coverProbe.onload = _coverProbe.onerror = null; }

			let probe = new Image();
			_coverProbe = probe;

			probe.onload = function() {
				if (probe !== _coverProbe) return; // a yet-newer call already took over
				_coverProbe = null;
				coverEl.src = url;
				bgBlur.style.backgroundImage = 'url("' + url + '")';
				bgBlur.style.backgroundColor = '';
			};
			probe.onerror = function() {
				if (probe !== _coverProbe) return;
				_coverProbe = null;
				coverEl.src = 'img/placeholder.png';
				bgBlur.style.backgroundImage = 'none';
				bgBlur.style.backgroundColor = '';
			};
			probe.src = url;
			ao_module_setWindowTitle(song.name);
		}

		function getCoverUrl(song) {
			return ao_root + 'system/file_system/loadThumbnail?bytes=true&vpath=' +
				encodeURIComponent(song.filepath);
		}

		function getArtistLabel(song) {
			var parts = song.filepath.split('/');
			return parts.length >= 3 ? parts[parts.length - 2] : '';
		}

		function highlightSelected() {
			var items = document.querySelectorAll('.list-item');
			for (var i = 0; i < items.length; i++) {
				var fp = items[i].getAttribute('data-filepath');
				items[i].classList.toggle('selected', !!(songInfo && fp === songInfo.filepath));
			}
			var sel = document.querySelector('.list-item.selected');
			if (sel) sel.scrollIntoView({ block: 'nearest' });
		}

		// ── Load & play a song ────────────────────────────────────────────
		function loadSong(song) {
			songInfo = song;
			mediaExchanging = true;
			setSource(song.filepath, true);
			updatePlayerMeta(song);
			highlightSelected();
			setTimeout(function() { mediaExchanging = false; }, 400);
		}

		// ── Navigation ────────────────────────────────────────────────────
		function getEffectiveList() { return shuffleMode ? shuffledList : songList; }

		function findIndex(list, song) {
			if (!song) return -1;
			for (var i = 0; i < list.length; i++) {
				if (list[i].filepath === song.filepath) return i;
			}
			return -1;
		}

		function nextSong() {
			var list = getEffectiveList();
			if (!list.length) return;
			var idx  = findIndex(list, songInfo);
			var next = idx + 1;
			if (next >= list.length) {
				if (repeatMode === 'all') next = 0;
				else { player.pause(); syncPlayIcon(); return; }
			}
			loadSong(list[next]);
		}

		function prevSong() {
			if (player.currentTime > 3) { player.currentTime = 0; return; }
			var list = getEffectiveList();
			if (!list.length) return;
			var idx  = findIndex(list, songInfo);
			var prev = idx - 1;
			if (prev < 0) prev = repeatMode === 'all' ? list.length - 1 : 0;
			loadSong(list[prev]);
		}

		// ── Audio events ──────────────────────────────────────────────────
		player.addEventListener('ended', function() {
			if (mediaExchanging) return;
			if (repeatMode === 'one') {
				player.currentTime = 0;
				player.play().catch(function() {});
			} else {
				nextSong();
			}
		});

		player.addEventListener('timeupdate', function() {
			if (mediaExchanging) return;
			var ct  = player.currentTime;
			var dur = player.duration || 0;
			document.getElementById('timeCurrent').textContent = fmt(ct);
			document.getElementById('timeTotal').textContent   = fmt(dur);
			var pct = dur > 0 ? (ct / dur) * 100 : 0;
			var sb  = document.getElementById('seekBar');
			sb.max   = Math.floor(dur) || 100;
			sb.value = Math.floor(ct);
			sb.style.setProperty('--progress', pct.toFixed(1) + '%');
		});

		player.addEventListener('play',  syncPlayIcon);
		player.addEventListener('pause', syncPlayIcon);

		// Safety net for a format our extension check didn't flag (or a Safari
		// quirk on a version we don't know about) that still fails natively —
		// retry once through the full-buffer transcode before giving up.
		player.addEventListener('error', function() {
			if (currentPlayingFilepath && !fullBufferAttempted) {
				loadViaFullBuffer(currentPlayingFilepath, true);
			}
		});

		function syncPlayIcon() {
			document.getElementById('playIcon').innerHTML = player.paused ? ICON_PLAY : ICON_PAUSE;
		}

		// ── Seek ──────────────────────────────────────────────────────────
		document.getElementById('seekBar').addEventListener('change', function() {
			player.currentTime = parseFloat(this.value);
		});

		// ── Volume ────────────────────────────────────────────────────────
		document.getElementById('volBar').addEventListener('input', function() {
			var v = parseInt(this.value) / 100;
			player.volume = v;
			isMuted = (v === 0);
			localStorage.setItem('global_volume', v);
			setVolumeUI(v);
		});

		function setVolumeUI(fraction) {
			var pct = Math.round(fraction * 100);
			document.getElementById('volBar').value = pct;
			document.getElementById('volBar').style.setProperty('--vol', pct + '%');
			document.getElementById('volIconEl').innerHTML = volumeIconSVG(fraction);
		}

		function toggleMute() {
			isMuted = !isMuted;
			if (isMuted) {
				savedVol = player.volume;
				player.muted = true;
				setVolumeUI(0);
			} else {
				player.muted = false;
				player.volume = savedVol || 0.6;
				setVolumeUI(player.volume);
			}
		}

		// ── Play / Pause ──────────────────────────────────────────────────
		function togglePlay() {
			if (player.paused) player.play().catch(function() {});
			else player.pause();
		}

		// ── Shuffle ───────────────────────────────────────────────────────
		function toggleShuffle() {
			shuffleMode = !shuffleMode;
			ao_module_storage.setStorage("Musicify", "emb_shuffle", String(shuffleMode));
			if (shuffleMode) buildShuffledList();
			updateShuffleUI();
		}

		function buildShuffledList() {
			var arr = songList.slice();
			for (var i = arr.length - 1; i > 0; i--) {
				var j = Math.floor(Math.random() * (i + 1));
				var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
			}
			shuffledList = arr;
		}

		function updateShuffleUI() {
			document.getElementById('shuffleBtn').classList.toggle('active', shuffleMode);
		}

		// ── Repeat ────────────────────────────────────────────────────────
		function cycleRepeat() {
			var modes = ['none', 'all', 'one'];
			var idx   = modes.indexOf(repeatMode);
			repeatMode = modes[(idx + 1) % modes.length];
			ao_module_storage.setStorage("Musicify", "emb_repeat", repeatMode);
			updateRepeatUI();
		}

		function updateRepeatUI() {
			var btn   = document.getElementById('repeatBtn');
			btn.classList.toggle('active', repeatMode !== 'none');
			btn.innerHTML = repeatIconSVG(repeatMode);
			btn.title = repeatMode === 'none' ? 'Repeat: off' :
			            repeatMode === 'all'  ? 'Repeat: all' : 'Repeat: one';
		}

		// ── Song list toggle ──────────────────────────────────────────────
		function toggleList() {
			listShown = !listShown;
			updateListVisibility();
			if (ao_module_virtualDesktop) {
				ao_module_setWindowSize(360, listShown ? 540 : 254);
			}
		}

		function updateListVisibility() {
			document.getElementById('songList').style.display = listShown ? '' : 'none';
			document.getElementById('listBtnLabel').textContent =
				listShown ? 'Hide List' : 'Show List';
		}

		// In standalone mode (non-virtualDesktop) the list is always visible
		if (!ao_module_virtualDesktop) {
			document.getElementById('listToggleBtn').style.display = 'none';
		}

		// ── Open in Musicify ──────────────────────────────────────────────
		function openInMusicify() {
			var folder = songInfo
				? songInfo.filepath.split('/').slice(0, -1).join('/')
				: '';
			ao_module_newfw({
				url: 'Musicify/index.html' +
				     (folder ? '#folder=' + encodeURIComponent(folder) : ''),
				title: 'Musicify',
				appicon: 'Musicify/img/module_icon.png',
				width: 1100,
				height: 720
			});
		}

		// ── Utilities ─────────────────────────────────────────────────────
		function fmt(s) {
			if (!s || isNaN(s)) return '0:00';
			s = Math.floor(s);
			return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
		}

		function escHtml(str) {
			return String(str)
				.replace(/&/g, '&amp;').replace(/</g, '&lt;')
				.replace(/>/g, '&gt;').replace(/"/g, '&quot;');
		}
	</script>
</body>
