<!--
    Language

    Loaded into System Settings. The display language is kept per browser
    (localStorage "global_language"); the coverage table comes from
    /system/info/getLocaleInfo.
-->
<style>
#lc-root .lc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
}
#lc-root .lc-table th {
    height: 33px;
    padding: 0 10px;
    text-align: left;
    font-size: 11.5px;
    font-weight: 400;
    color: var(--ss-muted);
    border-bottom: 1px solid var(--ss-border);
    white-space: nowrap;
}
#lc-root .lc-table td {
    height: 34px;
    padding: 0 10px;
    border-bottom: 1px solid var(--ss-border);
    vertical-align: middle;
}
#lc-root .lc-table th:first-child,
#lc-root .lc-table td:first-child { padding-left: 14px; }
#lc-root .lc-table th:last-child,
#lc-root .lc-table td:last-child { padding-right: 14px; text-align: right; }

#lc-root .lc-code {
    width: 64px;
    font-family: var(--ss-mono);
    font-size: 11px;
    color: var(--ss-muted);
    white-space: nowrap;
}
#lc-root .lc-name {
    color: var(--ss-text);
    white-space: nowrap;
}
#lc-root .lc-name .ss-badge { margin-left: 8px; vertical-align: 1px; }
#lc-root .lc-cov { width: 220px; white-space: nowrap; }
#lc-root .lc-bar {
    display: inline-block;
    width: 148px;
    height: 5px;
    border-radius: 3px;
    background: var(--ss-surface-3);
    overflow: hidden;
    vertical-align: middle;
}
#lc-root .lc-bar span { display: block; height: 100%; border-radius: 3px; }
#lc-root .lc-bar .high   { background: var(--ss-success-solid); }
#lc-root .lc-bar .medium { background: #d9930d; }
#lc-root .lc-bar .low    { background: var(--ss-danger); }
#lc-root .lc-pct {
    display: inline-block;
    min-width: 46px;
    margin-left: 12px;
    font-size: 12px;
    font-weight: 600;
    text-align: right;
    vertical-align: middle;
}
#lc-root .lc-pct.high   { color: var(--ss-success); }
#lc-root .lc-pct.medium { color: var(--ss-warning); }
#lc-root .lc-pct.low    { color: var(--ss-danger); }
#lc-root .lc-files {
    width: 80px;
    font-size: 12px;
    color: var(--ss-muted);
    white-space: nowrap;
}

#lc-root .lc-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 36px;
    padding: 8px 14px;
    font-size: 12.5px;
}
#lc-root .lc-foot .k { color: var(--ss-text-2); }
#lc-root .lc-foot .v { color: var(--ss-text); text-align: right; }

#lc-root .lc-help {
    margin: 10px 2px 0;
    font-size: 11.5px;
    color: var(--ss-text-3);
}
#lc-root .lc-help a {
    color: var(--ss-link);
    text-decoration: underline;
    text-underline-offset: 2px;
}

#lc-root .lc-skel {
    display: block;
    height: 10px;
    border-radius: 5px;
    background: var(--ss-surface-3);
}

#lc-root #lc-language-select { max-width: 200px; }

/* The code shows under the name on narrow screens, where its column is hidden */
#lc-root .lc-name-code { display: none; }

@media (max-width: 560px) {
    #lc-root .lc-bar { display: none; }
    #lc-root .lc-cov { width: auto; }
    #lc-root .lc-pct { margin-left: 0; min-width: 0; }
    #lc-root .lc-table .lc-code,
    #lc-root .lc-table .lc-files { display: none; }
    #lc-root .lc-table td { height: auto; padding-top: 8px; padding-bottom: 8px; }
    #lc-root .lc-table th:nth-child(2),
    #lc-root .lc-table td.lc-name { padding-left: 14px; white-space: normal; }
    #lc-root .lc-name .ss-badge { margin-left: 6px; }
    #lc-root .lc-table .lc-cov { text-align: right; padding-right: 14px; }
    #lc-root .lc-name-code {
        display: block;
        margin-top: 2px;
        font-family: var(--ss-mono);
        font-size: 10.5px;
        color: var(--ss-muted);
    }
    #lc-root .lc-foot { flex-wrap: wrap; }
    #lc-root .lc-foot .v { text-align: left; }
}
</style>

<div id="lc-root">
    <div class="ss-section">
        <div class="ss-card">
            <div class="ss-row">
                <div class="ss-row-text">
                    <div class="ss-row-label" locale="locale/display-language-label">Display language</div>
                    <div class="ss-row-desc" locale="locale/display-language-desc">Applies to ArozOS in this browser on this device.</div>
                </div>
                <div class="ss-control">
                    <select id="lc-language-select" class="ss-select">
                        <option value="default" locale="locale/browser-default">Browser default</option>
                    </select>
                    <button type="button" id="lc-update-btn" class="ss-btn primary" locale="locale/apply-button">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <div class="ss-section">
        <div class="ss-section-title" locale="locale/language-coverage-title">Translation coverage</div>
        <div class="ss-card">
            <table class="lc-table">
                <thead>
                    <tr>
                        <th class="lc-code" locale="locale/lang-col-code">Code</th>
                        <th locale="locale/lang-col-name">Language</th>
                        <th class="lc-cov" locale="locale/lang-col-coverage">Coverage</th>
                        <th class="lc-files" locale="locale/lang-col-files">Files</th>
                    </tr>
                </thead>
                <tbody id="lc-coverage-tbody">
                    <tr><td class="lc-code"><span class="lc-skel" style="width:36px"></span></td><td class="lc-name"><span class="lc-skel" style="width:120px"></span></td><td class="lc-cov"><span class="lc-skel" style="width:148px"></span></td><td class="lc-files"><span class="lc-skel" style="width:36px;margin-left:auto"></span></td></tr>
                    <tr><td class="lc-code"><span class="lc-skel" style="width:36px"></span></td><td class="lc-name"><span class="lc-skel" style="width:90px"></span></td><td class="lc-cov"><span class="lc-skel" style="width:148px"></span></td><td class="lc-files"><span class="lc-skel" style="width:36px;margin-left:auto"></span></td></tr>
                </tbody>
            </table>
            <div class="lc-foot" id="lc-contributors" style="display:none;">
                <span class="k" locale="locale/lang-contributors">Contributors</span>
                <span class="v" id="lc-contributors-list"></span>
            </div>
        </div>
        <div class="lc-help">
            <span locale="locale/lang-missing-text">Missing your language?</span>
            <a href="https://github.com/tobychui/arozos/tree/master/src/web/SystemAO/locale" target="_blank" rel="noopener" locale="locale/lang-help-link">Help translate ArozOS</a>
        </div>
    </div>
</div>

<script>
(function () {
    var lcLocale = NewAppLocale();
    function t(key, fallback) {
        try { return lcLocale.getString('locale/' + key, fallback) || fallback; } catch (e) { return fallback; }
    }

    var savedLang = null;
    try { savedLang = localStorage.getItem('global_language'); } catch (e) {}
    var inUse = String(savedLang && savedLang !== 'default' ? savedLang : (navigator.language || '')).toLowerCase();

    function esc(text) { return $('<span>').text(text == null ? '' : String(text)).html(); }

    function level(pct) {
        if (pct >= 75) return 'high';
        if (pct >= 40) return 'medium';
        return 'low';
    }

    /* Language list from the File Manager locale, which covers every language */
    function loadLanguages() {
        $.getJSON('../locale/file_explorer.json', function (data) {
            var $sel = $('#lc-language-select');
            for (var key in data.keys) {
                if (!data.keys.hasOwnProperty(key)) continue;
                $sel.append($('<option></option>').val(key).text(data.keys[key].name || key));
            }
            $sel.val(savedLang && $sel.find('option[value="' + savedLang + '"]').length ? savedLang : 'default');
        });
    }

    function loadCoverage() {
        $.getJSON('../../system/info/getLocaleInfo', function (data) {
            var $tbody = $('#lc-coverage-tbody').empty();
            if (!data || !data.languages || data.languages.length === 0) {
                $tbody.append('<tr><td colspan="4" class="ss-empty">' + esc(t('no-data', 'No data available')) + '</td></tr>');
                return;
            }
            data.languages.forEach(function (lang) {
                var cls = level(lang.coverage);
                var code = String(lang.code || '');
                var badge = code.toLowerCase() === inUse ? '<span class="ss-badge accent">' + esc(t('in-use', 'In use')) + '</span>' : '';
                $tbody.append('<tr>' +
                    '<td class="lc-code">' + esc(code) + '</td>' +
                    '<td class="lc-name">' + esc(lang.name || code) + badge + '<span class="lc-name-code">' + esc(code) + '</span></td>' +
                    '<td class="lc-cov"><span class="lc-bar"><span class="' + cls + '" style="width:' + Math.min(lang.coverage, 100) + '%"></span></span>' +
                        '<span class="lc-pct ' + cls + '">' + lang.coverage.toFixed(1) + '%</span></td>' +
                    '<td class="lc-files">' + lang.fileCount + ' / ' + lang.totalFiles + '</td>' +
                    '</tr>');
            });
            if (data.contributors && data.contributors.length > 0) {
                $('#lc-contributors-list').text(data.contributors.join(', '));
                $('#lc-contributors').show();
            }
        }).fail(function () {
            $('#lc-coverage-tbody').html('<tr><td colspan="4" class="ss-empty">' + esc(t('load-failed', 'Failed to load coverage data')) + '</td></tr>');
        });
    }

    $('#lc-update-btn').on('click', function () {
        var val = $('#lc-language-select').val();
        try { localStorage.setItem('global_language', val); } catch (e) {}
        if (typeof msgbox === 'function') {
            msgbox(t('setting-updated-title', 'Setting updated. Sign out and in again to apply it.'), true, 4500);
        }
    });

    function start() {
        loadLanguages();
        loadCoverage();
    }

    lcLocale.init('../locale/system_settings/locale.json', function () {
        lcLocale.translate();
        start();
    }, start);
})();
</script>
