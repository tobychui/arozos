<!--
    Module List

    Loaded into System Settings. Lists every loaded module (WebApps and
    subservices) from /system/modules/list as one row each, so the page reads
    the same in a wide window and on a phone.
-->
<style>
#ml-root .ml-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--ss-border);
}
#ml-root .ml-item:last-child { border-bottom: none; }

#ml-root .ml-icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 7px;
    object-fit: contain;
}

#ml-root .ml-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px 16px;
}
#ml-root .ml-text { flex: 1 1 200px; min-width: 0; }
#ml-root .ml-name {
    font-size: 13px;
    line-height: 18px;
    font-weight: 600;
    color: var(--ss-text);
    overflow-wrap: anywhere;
}
#ml-root .ml-version {
    margin-left: 6px;
    font-size: 11.5px;
    font-weight: 400;
    color: var(--ss-muted);
}
#ml-root .ml-ext {
    margin-top: 3px;
    font-family: var(--ss-mono);
    font-size: 11px;
    line-height: 16px;
    color: var(--ss-text-3);
    overflow-wrap: anywhere;
}
#ml-root .ml-ext .k {
    font-family: var(--ss-font, inherit);
    color: var(--ss-muted);
}

#ml-root .ml-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 4px;
    max-width: 100%;
}
#ml-root .ml-meta .ss-badge svg { width: 10px; height: 10px; }
#ml-root .ml-group { font-weight: 600; }

#ml-root .ml-skel {
    display: block;
    height: 10px;
    border-radius: 5px;
    background: var(--ss-surface-3);
}

@media (max-width: 560px) {
    #ml-root .ml-meta { justify-content: flex-start; }
}
</style>

<div id="ml-root">
    <div class="ss-section">
        <div class="ss-card" id="ml-list">
            <div class="ml-item"><span class="ml-skel" style="width:32px;height:32px;border-radius:7px"></span><div class="ml-main"><span class="ml-skel" style="width:160px;margin-top:4px"></span></div></div>
            <div class="ml-item"><span class="ml-skel" style="width:32px;height:32px;border-radius:7px"></span><div class="ml-main"><span class="ml-skel" style="width:120px;margin-top:4px"></span></div></div>
        </div>
    </div>

    <div class="ss-section">
        <div class="ss-card">
            <div class="ss-row">
                <div class="ss-row-text">
                    <div class="ss-row-label" locale="button/reload">Reload WebApps</div>
                    <div class="ss-row-desc" locale="desc/reload">If you have installed WebApps manually, you can click the "Reload WebApps" button to load it without restarting ArozOS.</div>
                </div>
                <div class="ss-control">
                    <button type="button" id="ml-reload-btn" class="ss-btn">
                        <i class="refresh icon"></i><span locale="button/reload">Reload WebApps</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    var mlLocale = NewAppLocale();
    function t(key, fallback) {
        try { return mlLocale.getString(key, fallback) || fallback; } catch (e) { return fallback; }
    }
    function esc(text) { return $('<span>').text(text == null ? '' : String(text)).html(); }

    var CHECK = '<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var MAX_EXT = 8;

    function renderModule(mod) {
        var icon = mod.IconPath ? '../../' + mod.IconPath : '../../img/system/service.png';

        var modes = [];
        if (mod.StartDir) modes.push(t('table/modes/default', 'Default'));
        if (mod.SupportFW) modes.push(t('table/modes/floatwindow', 'FloatWindow'));
        if (mod.SupportEmb) modes.push(t('table/modes/embedded', 'Embedded'));

        var ext = '';
        var list = mod.SupportedExt || [];
        if (list.length > 0) {
            var shown = list.slice(0, MAX_EXT).join(' ');
            if (list.length > MAX_EXT) shown += ' +' + (list.length - MAX_EXT);
            ext = '<div class="ml-ext" title="' + esc(list.join(' ')) + '"><span class="k">' + esc(t('table/ext', 'Supported Extensions')) + ':</span> ' + esc(shown) + '</div>';
        }

        return '<div class="ml-item">' +
            '<img class="ml-icon" src="' + esc(icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../img/system/service.png\'">' +
            '<div class="ml-main">' +
                '<div class="ml-text">' +
                    '<div class="ml-name">' + esc(mod.Name) + (mod.Version ? '<span class="ml-version">' + esc(t('item/version', 'Version:')) + ' ' + esc(mod.Version) + '</span>' : '') + '</div>' +
                    ext +
                '</div>' +
                '<div class="ml-meta">' +
                    '<span class="ss-badge ml-group" title="' + esc(t('table/group', 'Group')) + '">' + esc(mod.Group || 'Other') + '</span>' +
                    modes.map(function (m) { return '<span class="ss-badge accent" title="' + esc(t('table/modes', 'Supported Mode')) + '">' + CHECK + esc(m) + '</span>'; }).join('') +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function loadModules() {
        $.getJSON('../../system/modules/list', function (data) {
            var $list = $('#ml-list');
            if (!data || data.length === 0) {
                $list.html('<div class="ss-empty">' + esc(t('item/empty', 'No modules loaded')) + '</div>');
                return;
            }
            $list.html(data.map(renderModule).join(''));
        }).fail(function () {
            $('#ml-list').html('<div class="ss-empty">' + esc(t('item/loadfail', 'Failed to load the module list')) + '</div>');
        });
    }

    $('#ml-reload-btn').on('click', function () {
        var $btn = $(this).prop('disabled', true);
        $.ajax({
            url: '../../system/modules/reload',
            success: function () {
                $btn.prop('disabled', false);
                loadModules();
            },
            error: function () {
                $btn.html('<i class="remove icon"></i>' + esc(t('button/nopermission', 'No Permission')));
            }
        });
    });

    mlLocale.init('../locale/system_settings/modulelist.json', function () {
        mlLocale.translate();
        loadModules();
    }, loadModules);
})();
</script>
