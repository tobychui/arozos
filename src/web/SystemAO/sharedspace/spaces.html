<!DOCTYPE html>
<html>
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta charset="UTF-8">
    <!-- ao_module is provided by the parent frame; ao_module.js is not needed standalone -->
    <script src="../../script/jquery.min.js"></script>
    <title>Shared Spaces</title>
    <style>
    /* Scoped to #ss-root: this page is loaded into the System Settings document */
    :where(#ss-root, #ss-root *, #ss-root *::before, #ss-root *::after) { box-sizing: border-box; margin: 0; padding: 0; }

    #ss-root {
        --bg:      transparent;
        --card:    var(--ss-surface);
        --border:  var(--ss-border);
        --text:    var(--ss-text);
        --dim:     var(--ss-text-2);
        --muted:   var(--ss-muted);
        --accent:  var(--ss-accent);
        --accentH: var(--ss-accent-hover);
        --success: var(--ss-success);
        --danger:  var(--ss-danger);
        --radius:  var(--ss-radius);
        --shadow:  none;

        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
    }

    /* The System Settings header already shows the page title */
    #ss-root h1 { display: none; }
    #ss-root .subtitle { color: var(--ss-text-3); font-size: 12px; margin: 0 2px 14px; }

    #ss-root .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px 16px;
        margin-bottom: 14px;
    }
    #ss-root .card h2 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }

    #ss-root .conf-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 12px;
    }
    #ss-root .conf-field label { display: block; color: var(--dim); margin-bottom: 4px; }
    #ss-root .conf-field input[type="number"] {
        width: 100%;
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--ss-border-strong);
        border-radius: var(--ss-radius-sm);
        background: var(--ss-field);
        color: var(--text);
        font-size: 13px;
    }
    #ss-root .conf-field .checkline { display: flex; align-items: center; gap: 6px; padding-top: 7px; }

    #ss-root .btn {
        display: inline-block;
        border: none;
        border-radius: var(--ss-radius-sm);
        padding: 6px 14px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
    }
    #ss-root .btn:hover { background: var(--accentH); }
    #ss-root .btn.secondary { background: var(--ss-surface); color: var(--text); box-shadow: 0 0 0 1px var(--ss-border-strong) inset; }
    #ss-root .btn.secondary:hover { background: var(--ss-surface-2); }
    #ss-root .btn.danger { background: var(--ss-danger-solid); }
    #ss-root .btn.danger:hover { background: var(--ss-danger-hover); }
    #ss-root .btn.mini { padding: 4px 10px; font-size: 12px; }

    #statusMsg { display: none; margin-left: 10px; color: var(--success); }

    #ss-root table { width: 100%; border-collapse: collapse; }
    #ss-root th, #ss-root td {
        text-align: left;
        padding: 7px 8px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
    }
    #ss-root th { color: var(--ss-muted); font-weight: 400; font-size: 11.5px; }
    #ss-root table tr:hover > td { background: var(--ss-hover); }
    #ss-root td.name-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    #ss-root .tablewrap { overflow-x: auto; }
    #ss-root .pill {
        display: inline-block;
        border-radius: 10px;
        padding: 1px 9px;
        font-size: 11px;
        font-weight: 600;
        background: var(--ss-surface-3);
        color: var(--dim);
    }
    #ss-root .pill.public { background: var(--ss-success-soft); color: var(--ss-success); }
    #ss-root .pill.private { background: var(--ss-danger-soft); color: var(--ss-danger); }
    #ss-root .pill.persist { background: var(--ss-accent-soft); color: var(--ss-accent-text); }
    #ss-root .empty-row { color: var(--muted); text-align: center; padding: 18px 0; }
    </style>
</head>
<body>
<div id="ss-root">
    <h1>Shared Spaces</h1>
    <div class="subtitle">Collaboration spaces used by web apps, AGI scripts and MeetRoom meetings</div>

    <div class="card">
        <h2>Limits and Retention</h2>
        <div class="conf-grid">
            <div class="conf-field">
                <label for="confMaxUpload">Max upload size (MB)</label>
                <input type="number" id="confMaxUpload" min="1" step="1">
            </div>
            <div class="conf-field">
                <label for="confMaxItems">Items per space</label>
                <input type="number" id="confMaxItems" min="1" step="1">
            </div>
            <div class="conf-field">
                <label for="confRetention">Retention (days, 0 = keep forever)</label>
                <input type="number" id="confRetention" min="0" step="1">
            </div>
            <div class="conf-field">
                <label>Persistent spaces</label>
                <div class="checkline">
                    <input type="checkbox" id="confAllowPersistent">
                    <span>Allow creating persistent spaces</span>
                </div>
            </div>
        </div>
        <button class="btn" id="saveConfigBtn">Save Settings</button>
        <span id="statusMsg">Saved</span>
    </div>

    <div class="card">
        <h2>Live Spaces <button class="btn secondary mini" id="refreshBtn" style="float:right;">Refresh</button></h2>
        <div class="tablewrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Owner</th>
                        <th>Access</th>
                        <th>Storage</th>
                        <th>Items</th>
                        <th>Docs</th>
                        <th>Members</th>
                        <th>Online</th>
                        <th>Size</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="spacesTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function escapeHtml(text) {
        return $("<div>").text(text === undefined || text === null ? "" : String(text)).html();
    }

    function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " B";
        var units = ["KB", "MB", "GB"];
        var value = bytes;
        for (var i = 0; i < units.length; i++) {
            value = value / 1024;
            if (value < 1024 || i === units.length - 1) {
                return value.toFixed(1) + " " + units[i];
            }
        }
    }

    function loadConfig() {
        $.get("/system/sharedspace/admin/config", function (data) {
            if (data.error !== undefined) return;
            $("#confMaxUpload").val(Math.round(data.maxupload / (1024 * 1024)));
            $("#confMaxItems").val(data.maxitems);
            $("#confRetention").val(data.retentiondays);
            $("#confAllowPersistent").prop("checked", data.allowpersistent === true);
        }, "json");
    }

    function saveConfig() {
        $.post("/system/sharedspace/admin/setconfig", {
            maxupload: Math.max(1, parseInt($("#confMaxUpload").val()) || 0) * 1024 * 1024,
            maxitems: $("#confMaxItems").val(),
            retentiondays: $("#confRetention").val(),
            allowpersistent: $("#confAllowPersistent").prop("checked") ? "true" : "false"
        }, function () {
            $("#statusMsg").show().delay(1500).fadeOut();
            loadConfig();
        });
    }

    function accessPill(access) {
        var cls = access === "public" ? "public" : (access === "private" ? "private" : "");
        return '<span class="pill ' + cls + '">' + escapeHtml(access) + '</span>';
    }

    function loadSpaces() {
        $.get("/system/sharedspace/admin/list", function (data) {
            var tbody = $("#spacesTable");
            tbody.empty();
            if (data.error !== undefined || !Array.isArray(data) || data.length === 0) {
                tbody.append('<tr><td colspan="11" class="empty-row">No live shared spaces</td></tr>');
                return;
            }
            data.sort(function (a, b) { return b.createdat - a.createdat; });
            data.forEach(function (space) {
                var row = $("<tr>");
                row.append($('<td class="name-cell">').attr("title", space.spaceid).text(space.name));
                row.append($("<td>").text(space.owner));
                row.append($("<td>").html(accessPill(space.access)));
                row.append($("<td>").html(space.persistent ? '<span class="pill persist">persistent</span>' : '<span class="pill">ephemeral</span>'));
                row.append($("<td>").text(space.items));
                row.append($("<td>").text(space.docs));
                row.append($("<td>").text(space.members));
                row.append($("<td>").text(space.subscribers));
                row.append($("<td>").text(formatBytes(space.diskusage)));
                row.append($("<td>").text(new Date(space.createdat * 1000).toLocaleString()));
                var deleteBtn = $('<button class="btn danger mini">Delete</button>').on("click", function () {
                    if (!confirm('Delete the space "' + space.name + '" and all its content?')) return;
                    $.post("/system/sharedspace/admin/delete", { spaceid: space.spaceid }, function () {
                        loadSpaces();
                    });
                });
                row.append($("<td>").append(deleteBtn));
                tbody.append(row);
            });
        }, "json");
    }

    $("#saveConfigBtn").on("click", saveConfig);
    $("#refreshBtn").on("click", loadSpaces);
    loadConfig();
    loadSpaces();

    /* ── Theme: follow the System Settings host (light / dark) ── */
    (function () {
        var root = document.getElementById("ss-root");
        if (root && typeof preferredTheme !== "undefined") {
            root.classList.toggle("dark", preferredTheme === "dark" || preferredTheme === "darkTheme");
        } else if (root && window.matchMedia) {
            //Standalone (opened outside System Settings): follow the OS
            root.classList.toggle("dark", window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
    })();

    //Live toggle from the desktop dark/light switch
    window.detailPageThemeCallback = function (isDark) {
        var root = document.getElementById("ss-root");
        if (root) root.classList.toggle("dark", isDark);
    };
</script>
</body>
</html>
