<!DOCTYPE html>
<html>
    <head>
        <title locale="title/title">File Version History</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
        <link rel="stylesheet" href="../../script/semantic/semantic.min.css">
        <script type="text/javascript" src="../../script/jquery.min.js"></script>
        <script type="text/javascript" src="../../script/ao_module.js"></script>
        <script type="text/javascript" src="../../script/applocale.js"></script>
        <link rel="stylesheet" href="dialog.css">
        <script type="text/javascript" src="js/dialog.js"></script>
        <style>
            .versionHead{
                margin-bottom: 16px;
            }

            .versionHead h3{
                margin: 0px 0px 6px 0px;
                font-size: 17px;
                font-weight: 600;
                color: var(--dlg_text);
            }

            .versionHead .desc{
                color: var(--dlg_text_dim);
                font-size: 13px;
                line-height: 1.5;
            }

        </style>
    </head>
    <body class="whiteTheme">
        <div class="dialog">
            <div class="dialogBody">
                <div class="versionHead">
                    <h3 locale="title/title">File Version History</h3>
                    <div class="desc" locale="title/desc">Any file versions that is more than 30 days old will be automatically removed from the system.</div>
                </div>

                <button class="dlgBtn" onclick="createSnapshot();">
                    <i class="plus icon"></i> <span locale="button/newver">Create New Version</span>
                </button>

                <div class="dlgSectionLabel" locale="section/history">Version History</div>
                <div class="dlgList" id="versions">
                    <div class="dlgEmpty"><div class="dlgSpinner" style="margin: 0px auto 10px auto;"></div><div locale="message/loading">Loading...</div></div>
                </div>
            </div>

            <div class="dialogFooter">
                <button id="deleteAllBtn" class="dlgBtn danger" onclick="deleteAllVersions();">
                    <i class="trash icon"></i> <span locale="button/removeAll">Delete All Versions</span>
                </button>
                <div class="spacer"></div>
                <button class="dlgBtn" onclick="ao_module_close();" locale="button/close">Close</button>
            </div>
        </div>

        <div class="dlgMenu" id="rowMenu"></div>

        <script>
            /*
                file_versions.html

                The snapshots ArozOS keeps of one file, newest first, with the
                file as it stands now sitting on top of them as the current
                version. The per row actions moved into a menu because three
                icon buttons per row made the list read as a toolbar rather
                than as a history.

                Version numbers are assigned here, not by the server: the
                snapshot folder name is a timestamp, which is precise but tells
                the reader nothing about the order they are looking at.
            */
            var files = ao_module_loadInputFiles();
            var targetFile = "";
            var currentVersionList = [];
            var fileOwner = "";
            var currentFileInfo = null;
            var pollTimer = null;

            applocale.init("../../SystemAO/locale/file_versions.json", function(){
                applocale.translate();
                dlgInitTheme();

                if (files.length < 1){
                    renderNoFile();
                    return;
                }

                targetFile = files[0];
                loadFileInfo();
                loadVersionHistory(targetFile);

                //Another window may snapshot the same file while this one is open
                pollTimer = setInterval(function(){
                    checkHistoryListUpdate(targetFile);
                }, 3000);
            });

            $(document).on("click", function(event){
                if ($(event.target).closest("#rowMenu, .dlgIconBtn").length == 0){
                    $("#rowMenu").hide();
                }
            });

            function renderNoFile(){
                $("#versions").html('<div class="dlgEmpty"><i class="file outline icon"></i><div>' +
                    applocale.getString("message/nofile/title", "No File") + "</div></div>");
                $("#deleteAllBtn").addClass("disabled");
            }

            //The owner and the live file size are shown on the current version
            //row, and neither is part of the version history response
            function loadFileInfo(){
                $.ajax({
                    url: "../../system/file_system/getProperties",
                    data: {path: targetFile},
                    method: "POST",
                    success: function(data){
                        if (data == undefined || data.error !== undefined){
                            return;
                        }
                        currentFileInfo = data;
                        fileOwner = data.Owner;
                        renderVersionList();
                    }
                });
            }

            function checkHistoryListUpdate(vpath){
                $.ajax({
                    url: "../../system/file_system/versionHistory",
                    data: {path: vpath},
                    method: "POST",
                    success: function(data){
                        if (data != undefined && data.error == undefined){
                            if (currentVersionList.length != data.Versions.length){
                                loadVersionHistory(vpath);
                            }
                        }
                    }
                });
            }

            function loadVersionHistory(vpath){
                $.ajax({
                    url: "../../system/file_system/versionHistory",
                    data: {path: vpath},
                    method: "POST",
                    success: function(data){
                        if (data == undefined || data.error !== undefined){
                            $("#versions").html('<div class="dlgEmpty"><i class="question circle outline icon"></i><div>' +
                                dlgEscape(data == undefined ? "No response" : data.error) + "</div></div>");
                            return;
                        }
                        currentVersionList = data.Versions;
                        renderVersionList();
                    },
                    error: function(){
                        $("#versions").html('<div class="dlgEmpty"><i class="question circle outline icon"></i><div>' +
                            applocale.getString("message/failed", "Unable to read the version history") + "</div></div>");
                    }
                });
            }

            function ownerSuffix(){
                return (fileOwner == "") ? "" : " (" + fileOwner + ")";
            }

            function renderVersionList(){
                var html = "";
                var totalVersions = currentVersionList.length + 1;

                //The file as it stands now is the newest version
                if (currentFileInfo != null){
                    html += versionRowHTML({
                        number: totalVersions,
                        current: true,
                        time: currentFileInfo.LastModTime,
                        size: currentFileInfo.Filesize,
                        historyID: "",
                        relpath: ""
                    });
                }

                //Server returns newest first, so the number counts down
                for (var i = 0; i < currentVersionList.length; i++){
                    var entry = currentVersionList[i];
                    html += versionRowHTML({
                        number: currentVersionList.length - i,
                        current: false,
                        time: entry.OverwriteTime,
                        size: entry.Filesize,
                        historyID: entry.HistoryID,
                        relpath: entry.Relpath
                    });
                }

                if (currentVersionList.length == 0 && currentFileInfo == null){
                    html = '<div class="dlgEmpty"><i class="history icon"></i><div>' +
                        applocale.getString("message/nohist/title", "No History") + "</div><div>" +
                        applocale.getString("message/nohist/desc", "This file has no previous version histories.") + "</div></div>";
                }

                $("#versions").html(html);
                $("#deleteAllBtn").toggleClass("disabled", currentVersionList.length == 0);
            }

            function versionRowHTML(entry){
                var title = applocale.getString("version/label", "Version") + " " + entry.number;
                if (entry.current){
                    title += " " + applocale.getString("version/current", "(current)");
                }

                return '<div class="dlgListRow static' + (entry.current ? " selected" : "") + '">' +
                    '<div class="rowIcon"><i class="file outline icon"></i></div>' +
                    '<div class="rowText">' +
                        '<div class="rowTitle">' + dlgEscape(title) + "</div>" +
                        '<div class="rowSub">' + dlgEscape(entry.time + ownerSuffix()) + "</div>" +
                    "</div>" +
                    '<div class="rowMeta">' + dlgEscape(dlgBytesToSize(entry.size)) + "</div>" +
                    '<button class="dlgIconBtn" verid="' + dlgEscape(entry.historyID) + '" relpath="' + dlgEscape(entry.relpath) + '" ' +
                        'iscurrent="' + (entry.current ? "true" : "false") + '" onclick="openRowMenu(this);">' +
                        '<i class="ellipsis horizontal icon"></i></button>' +
                    "</div>";
            }

            function openRowMenu(button){
                var isCurrent = $(button).attr("iscurrent") == "true";
                var versionID = $(button).attr("verid");
                var relpath = $(button).attr("relpath");

                var html = '<div class="dlgMenuItem" onclick="downloadVersion(\'' + dlgEscape(relpath) + '\');">' +
                    '<i class="download icon"></i>' + applocale.getString("title/download", "Download Version") + "</div>";

                if (!isCurrent){
                    html += '<div class="dlgMenuItem" onclick="restoreVersion(\'' + dlgEscape(versionID) + '\');">' +
                        '<i class="history icon"></i>' + applocale.getString("title/restore", "Restore This Version") + "</div>";
                    html += '<div class="dlgMenuItem danger" onclick="deleteVersion(\'' + dlgEscape(versionID) + '\');">' +
                        '<i class="trash icon"></i>' + applocale.getString("title/delete", "Delete") + "</div>";
                }

                var menu = $("#rowMenu");
                menu.html(html).show();

                //Anchor under the button, kept inside the window
                var offset = $(button).offset();
                var left = offset.left + $(button).outerWidth() - menu.outerWidth();
                var top = offset.top + $(button).outerHeight() + 4;
                if (left < 8){
                    left = 8;
                }
                if (top + menu.outerHeight() > $(window).height() - 8){
                    top = offset.top - menu.outerHeight() - 4;
                }
                menu.css({left: left + "px", top: top + "px"});
            }

            function downloadVersion(relpath){
                $("#rowMenu").hide();
                var dirname = targetFile.split("/");
                dirname.pop();
                var accessPath = dirname.join("/") + "/" + (relpath == "" ? targetFile.split("/").pop() : relpath);
                window.open("../../media/download?file=" + accessPath);
            }

            function createSnapshot(){
                $.ajax({
                    url: "../../system/file_system/versionHistory",
                    data: {path: targetFile, opr: "new"},
                    method: "POST",
                    success: function(data){
                        if (data != undefined && data.error != undefined){
                            dlgToast(data.error);
                        }else{
                            dlgToast(applocale.getString("msgbox/created", "New Version Created"));
                            loadVersionHistory(targetFile);
                        }
                    }
                });
            }

            function restoreVersion(versionID){
                $("#rowMenu").hide();
                if (!confirm(applocale.getString("warning/restore", "Restoring this file will remove all newer version histories of this file. Confirm?"))){
                    return;
                }
                $.ajax({
                    url: "../../system/file_system/versionHistory",
                    data: {path: targetFile, opr: "restore", histid: versionID},
                    method: "POST",
                    success: function(data){
                        if (data != undefined && data.error != undefined){
                            dlgToast(data.error);
                        }else{
                            loadFileInfo();
                            loadVersionHistory(targetFile);
                            dlgToast(applocale.getString("msgbox/restored", "Restore Succeed"));
                        }
                    }
                });
            }

            function deleteVersion(versionID){
                $("#rowMenu").hide();
                $.ajax({
                    url: "../../system/file_system/versionHistory",
                    data: {path: targetFile, opr: "delete", histid: versionID},
                    method: "POST",
                    success: function(data){
                        if (data != undefined && data.error != undefined){
                            dlgToast(data.error);
                        }else{
                            loadVersionHistory(targetFile);
                        }
                    }
                });
            }

            function deleteAllVersions(){
                if (!confirm(applocale.getString("warning/deleteall", "This operation will **PERMANENTLY DELETE ALL** version history of this file. Confirm?"))){
                    return;
                }
                $.ajax({
                    url: "../../system/file_system/versionHistory",
                    data: {path: targetFile, opr: "deleteAll"},
                    method: "POST",
                    success: function(data){
                        if (data != undefined && data.error != undefined){
                            dlgToast(data.error);
                        }else{
                            dlgToast(applocale.getString("msgbox/deletedall", "All version history deleted"));
                            loadVersionHistory(targetFile);
                        }
                    }
                });
            }
        </script>
    </body>
</html>
