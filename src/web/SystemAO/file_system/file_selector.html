                    //Selected a folder in new mode. Only preview it
                    updateDetailsFor([object]);
                    return;
                }

                if (multiSelect && useCtrl){
                    //Add this into selection list
                    $(object).toggleClass("selected");
                }else if (multiSelect && useShift){
                    var start = parseInt(lastClickedItemID);
                    var end = parseInt($(object).attr("fid"));
                    if (isNaN(start)){
                        start = end;
                    }
                    if (start > end){
                        var swap = start;
                        start = end;
                        end = swap;
                    }
                    var fileObjects = $("#fileArea").find(".fileObject");
                    for (var k = start; k <= end; k++){
                        $(fileObjects[k]).addClass("selected");
                    }
                }else{
                    //Reset and add this into selection list
                    $(".fileObject.selected").removeClass("selected");
                    $(object).addClass("selected");
                }

                //Update last selected id
                lastClickedItemID = $(object).attr("fid");

                var selected = $("#fileArea").find(".fileObject.selected");
                if (selected.length == 1){
                    $("#filename").val(decodeURIComponent(selected.attr("filename")));
                }else if (selected.length > 1){
                    $("#filename").val("");
                }
                setWindowTitleForSelection(selected.length);
                updateDetailsFor(selected.toArray());
            }

            function setWindowTitleForSelection(objectCount){
                if (objectCount == 0){
                    ao_module_setWindowTitle("Open");
                    return;
                }
                var typeName = "object";
                if (type == "file"){
                    typeName = "file";
                }else if (type == "folder"){
                    typeName = "folder";
                }
                var desc = typeName + " selected";
                if (objectCount > 1){
                    desc = typeName + "s selected";
                }
                ao_module_setWindowTitle("Open (" + objectCount + " " + desc + ")");
            }

            function confirmSelection(){
                var files = [];
                $("#fileArea").find(".fileObject.selected").each(function(){
                    files.push({
                        filename: decodeURIComponent($(this).attr("filename")),
                        filepath: decodeURIComponent($(this).attr("filepath"))
                    });
                });

                //Check if currentdir end with "/". If not, append it
                if (currentDir.substr(currentDir.length - 1, 1) != "/"){
                    currentDir = currentDir + "/";
                }

                //Nothing highlighted but a name was typed: resolve it against the
                //current listing, the way a native open dialog does
                if (files.length == 0 && (type == "file" || type == "folder")){
                    var typedName = $("#filename").val().trim();
                    if (typedName != ""){
                        for (var i = 0; i < currentFileList.length; i++){
                            var candidate = currentFileList[i];
                            if (candidate.Filename == typedName &&
                                ((type == "folder" && candidate.IsDir) || (type == "file" && !candidate.IsDir))){
                                files.push({
                                    filename: candidate.Filename,
                                    filepath: candidate.Filepath
                                });
                                break;
                            }
                        }
                    }
                }

                //Check for special cases
                if (files.length == 0 && type == "folder"){
                    //Select the current path as target instead
                    var currentPathname = currentDir.split("/");
                    currentPathname.pop();
                    currentPathname = currentPathname.pop();
                    if (currentPathname == ""){
                        currentPathname = currentDir;
                    }

                    files.push({
                        filename: currentPathname,
                        filepath: currentDir
                    });
                }else if (files.length == 0 && type == "new"){
                    //Push this new file into the return structure
                    var newFilename = $("#filename").val();
                    files.push({
                        filename: newFilename,
                        filepath: currentDir + newFilename
                    });
                }

                selectionConfirmed = true;
                if (ao_module_virtualDesktop){
                    if (!ao_module_parentCallback(files)){
                        //Parent callback not exists
                        selectionConfirmed = false;
                        alert("Selection Failed. Is parent window alive?");
                    }else{
                        parent.closeFwProcess(ao_module_windowID);
                    }
                }else{
                    if (listenerUUID == ""){
                        selectionConfirmed = false;
                        alert("Invalid listener UUID. Please re-open your file selector.");
                        return;
                    }
                    localStorage.setItem(listenerUUID, JSON.stringify(files));
                    $("#waitloader").addClass("show");
                    setTimeout(function(){
                        $("#waitloadertext").text("System is not responding. Please close this window and retry.");
                    }, 10000);
                }
            }

            function cancelSelection(){
                if (selectionConfirmed || listenerUUID == ""){
                    return;
                }
                localStorage.setItem(listenerUUID, JSON.stringify("&&selection_canceled&&"));
            }

            function closeSelector(){
                cancelSelection();
                if (ao_module_virtualDesktop){
                    parent.closeFwProcess(ao_module_windowID);
                }else{
                    window.close();
                }
            }

            //Handle on window close function, cancel current selection
            window.onbeforeunload = function(){
                cancelSelection();
            }

            //Overwrite the ao_module close function so closing the float window
            //cancels the selection instead of silently returning nothing
            function ao_module_close(){
                closeSelector();
            }

            /* ------------------------------------------------------------------ */
            /*  Details panel                                                      */
            /* ------------------------------------------------------------------ */
            function clearDetails(){
                $("#detailsBody").html('<div class="fsDetailsEmpty">' +
                    escapeHTML(applocale.getString("details/empty", "Select an item to see its details")) + '</div>');
            }

            function updateDetailsPanel(){
                updateDetailsFor($("#fileArea").find(".fileObject.selected").toArray());
            }

            function updateDetailsFor(objects){
                if (!detailsOpen){
                    return;
                }
                if (objects == undefined || objects.length == 0){
                    clearDetails();
                    return;
                }
                if (objects.length > 1){
                    renderMultiDetails(objects);
                    return;
                }

                var target = $(objects[0]);
                var filename = decodeURIComponent(target.attr("filename"));
                var filepath = decodeURIComponent(target.attr("filepath"));
                var isDir = target.attr("isDir") == "true";

                var html = '<div class="fsDetailsPreview">' + largeGlyph(filename, isDir) + '<img class="fsThumbImg"></div>' +
                    '<div class="fsDetailsName">' + escapeHTML(filename) + '</div>' +
                    '<div id="detailRows">' +
                    detailRow(applocale.getString("details/type", "Type"), escapeHTML(getTypeName(filename, isDir))) +
                    detailRow(applocale.getString("details/size", "Size"), '<span id="detailSize">' +
                        escapeHTML(applocale.getString("message/loading", "Loading")) + '</span>') +
                    detailRow(applocale.getString("details/modified", "Date Modified"), '<span id="detailModified">--</span>') +
                    detailRow(applocale.getString("details/path", "Path"), escapeHTML(filepath)) +
                    '</div>';
                $("#detailsBody").html(html);

                //Reuse the thumbnail already rendered in the listing, if there is one
                var existingThumb = target.find(".fsThumbImg");
                if (existingThumb.length > 0 && existingThumb.hasClass("loaded")){
                    $("#detailsBody").find(".fsThumbImg").attr("src", existingThumb.attr("src")).addClass("loaded");
                    $("#detailsBody").find(".fsDetailsPreview").addClass("hasThumb");
                }else if (!isDir){
                    loadDetailsThumbnail(filepath);
                }

                loadDetailProperties(filepath, filename, isDir);
            }

            function detailRow(key, valueHTML){
                return '<div class="fsDetailRow"><div class="fsDetailKey">' + escapeHTML(key) + '</div>' +
                    '<div class="fsDetailVal">' + valueHTML + '</div></div>';
            }

            function loadDetailsThumbnail(filepath){
                $.ajax({
                    url: "../../system/file_system/loadThumbnail",
                    data: {vpath: filepath},
                    success: function(data){
                        if (data == undefined || data == "" || data.error != undefined){
                            return;
                        }
                        var selected = $("#fileArea").find(".fileObject.selected");
                        //Only paint it if the user has not moved the selection on
                        if (selected.length == 1 && decodeURIComponent(selected.attr("filepath")) != filepath){
                            return;
                        }
                        $("#detailsBody").find(".fsThumbImg")
                            .attr("src", FileThumb.base64ToDataURL(data))
                            .addClass("loaded");
                        $("#detailsBody").find(".fsDetailsPreview").addClass("hasThumb");
                    }
                });
            }

            function loadDetailProperties(filepath, filename, isDir){
                $.ajax({
                    url: "../../system/file_system/getProperties",
                    method: "POST",
                    data: {path: filepath},
                    success: function(data){
                        if (data.error !== undefined){
                            $("#detailSize").text("--");
                            return;
                        }
                        $("#detailSize").text(data.Filesize < 0 ? "--" :
                            formatBytes(data.Filesize) + " (" + data.Filesize.toLocaleString() + " " +
                            applocale.getString("details/bytes", "bytes") + ")");
                        $("#detailModified").text(data.LastModTime || formatTimestamp(data.LastModUnix));

                        if (data.Owner != undefined && data.Owner != ""){
                            $("#detailRows").append(detailRow(applocale.getString("details/owner", "Owner"), escapeHTML(data.Owner)));
                        }
                        if (data.Permission != undefined && data.Permission != ""){
                            $("#detailRows").append(detailRow(applocale.getString("details/permission", "Permission"), escapeHTML(data.Permission)));
                        }
                    },
                    error: function(){
                        $("#detailSize").text("--");
                    }
                });

                //Show which WebApp would open this file, using the registered
                //default opener of its extension
                if (!isDir){
                    getDefaultOpener("." + getExt(filename), function(moduleInfo){
                        if (moduleInfo == null){
                            return;
                        }
                        var iconHTML = "";
                        if (moduleInfo.IconPath != undefined && moduleInfo.IconPath != ""){
                            iconHTML = '<img class="fsOpenerIcon" src="../../' + escapeHTML(moduleInfo.IconPath) +
                                '" onerror="this.style.display=\'none\';">';
                        }
                        $("#detailRows").append(detailRow(applocale.getString("details/opensWith", "Opens With"),
                            iconHTML + '<span>' + escapeHTML(moduleInfo.Name || "") + '</span>'));
                    });
                }
            }

            function renderMultiDetails(objects){
                var folderCount = 0;
                var fileCount = 0;
                for (var i = 0; i < objects.length; i++){
                    if ($(objects[i]).attr("isDir") == "true"){
                        folderCount++;
                    }else{
                        fileCount++;
                    }
                }
                var html = '<div class="fsDetailsPreview">' + largeGlyph("", true) + '</div>' +
                    '<div class="fsDetailsName">' + objects.length + " " +
                        escapeHTML(applocale.getString("details/itemsSelected", "items selected")) + '</div>' +
                    '<div id="detailRows">' +
                    detailRow(applocale.getString("details/folders", "Folders"), folderCount) +
                    detailRow(applocale.getString("details/files", "Files"), fileCount) +
                    '</div>';
                $("#detailsBody").html(html);
            }

            /* ------------------------------------------------------------------ */
            /*  Sidebar                                                            */
            /* ------------------------------------------------------------------ */
            function initRoots(){
                $.get("../../system/file_system/listRoots?user=true", function(data){
                    $("#userlist").html("");
                    if (data == null || data.error != undefined){
                        return;
                    }
                    for (var i = 0; i < data.length; i++){
                        if (data[i].IsDir != true){
                            continue;
                        }
                        if (data[i]["Filename"].substring(0, 1) == "."){
                            //Do not show hidden files
                            continue;
                        }
                        var iconAndFolderName = getUserRootIcons(data[i]["Filename"]);
                        $("#userlist").append(sidebarItem(data[i]["Filepath"], iconAndFolderName[0], iconAndFolderName[1], iconAndFolderName[2]));
                    }
                    updateSidebarActiveItem();
                });

                $.get("../../system/file_system/listRoots", function(data){
                    $("#storagelist").html("");
                    if (data == null || data.error != undefined){
                        return;
                    }
                    for (var i = 0; i < data.length; i++){
                        rootNameMap[data[i]["RootPath"]] = data[i]["RootName"];
                        $("#storagelist").append(sidebarItem(data[i]["RootPath"], ICONS.drive, "#5f6368",
                            data[i]["RootName"] + " (" + data[i]["RootPath"] + ")"));
                    }
                    renderBreadcrumb();
                    updateSidebarActiveItem();
                });
            }

            function sidebarItem(filepath, iconSVG, iconColor, label){
                return '<div class="fsSideItem" filepath="' + encodeURIComponent(filepath) + '" onclick="openShortcut(this);" title="' + escapeHTML(label) + '">' +
                    '<span class="fsSideIcon" style="color:' + iconColor + ';">' + iconSVG + '</span>' +
                    '<span class="fsSideLabel">' + escapeHTML(label) + '</span></div>';
            }

            //Returns [svg, colour, localized name] for a user virtual root folder
            function getUserRootIcons(foldername){
                var icon = ICONS.folderSide;
                var color = "#f0b429";
                var name = foldername;
                var key = foldername.toLowerCase();
                if (key == "desktop"){
                    icon = ICONS.desktop;
                    color = "#1a73e8";
                    name = applocale.getString("sidebar/vroot/desktop", name);
                }else if (key == "document"){
                    icon = ICONS.document;
                    color = "#1a73e8";
                    name = applocale.getString("sidebar/vroot/document", name);
                }else if (key == "music" || key == "audio"){
                    icon = ICONS.music;
                    color = "#e8467c";
                    name = applocale.getString("sidebar/vroot/music", name);
                }else if (key == "photo" || key == "picture"){
                    icon = ICONS.image;
                    color = "#2aa3d4";
                    name = applocale.getString("sidebar/vroot/photo", name);
                }else if (key == "video" || key == "film"){
                    icon = ICONS.video;
                    color = "#8b5cf6";
                    name = applocale.getString("sidebar/vroot/video", name);
                }else if (key == "trash" || key == "bin" || key == "rubbish"){
                    icon = ICONS.trash;
                    color = "#5f6368";
                    name = applocale.getString("sidebar/vroot/trash", name);
                }else if (key == "download"){
                    icon = ICONS.download;
                    color = "#1a73e8";
                    name = applocale.getString("sidebar/vroot/download", name);
                }else if (key == "www" || key == "web" || key == "mysite"){
                    icon = ICONS.globe;
                    color = "#0f9d94";
                    name = applocale.getString("sidebar/vroot/web", name);
                }else if (key == "model"){
                    icon = ICONS.cube;
                    color = "#7c4dff";
                    name = applocale.getString("sidebar/vroot/model", name);
                }else if (key == "appdata"){
                    icon = ICONS.code;
                    color = "#5f6368";
                    name = applocale.getString("sidebar/vroot/appdata", name);
                }
                return [icon, color, name];
            }

            function openShortcut(object){
                var targetdir = decodeURIComponent($(object).attr("filepath"));
                listDir(targetdir);
                if (window.innerWidth < 560){
                    closeSidebar();
                }
            }

            function updateSidebarActiveItem(){
                $(".fsSideItem").each(function(){
                    var itemPath = decodeURIComponent($(this).attr("filepath"));
                    if (itemPath.substring(itemPath.length - 1) != "/"){
                        itemPath = itemPath + "/";
                    }
                    var here = currentDir;
                    if (here.substring(here.length - 1) != "/"){
                        here = here + "/";
                    }
                    $(this).toggleClass("active", itemPath == here);
                });
            }

            function toggleSidebar(){
                if ($("#sidebar").hasClass("open")){
                    closeSidebar();
                }else{
                    $("#sidebar").addClass("open");
                    $("#sidebarScrim").addClass("show");
                }
            }

            function closeSidebar(){
                $("#sidebar").removeClass("open");
                $("#sidebarScrim").removeClass("show");
            }

            /* ------------------------------------------------------------------ */
            /*  New folder                                                         */
            /* ------------------------------------------------------------------ */
            function menuNewFolder(){
                closeMoreMenu();
                newFolder();
            }

            /*
                Creates the folder straight away under a localized default name, then
                drops the freshly created item into inline edit so the user can type
                over it - the same flow as the desktop file managers.
            */
            function newFolder(){
                createFolder(getUniqueNewFolderName(), true);
            }

            //"New Folder", "New Folder (2)", ... so the create never collides
            function getUniqueNewFolderName(){
                var base = applocale.getString("newfolder/defaultname", "New Folder");
                var taken = {};
                currentFileList.forEach(function(fileObject){
                    taken[fileObject.Filename] = true;
                });
                if (taken[base] == undefined){
                    return base;
                }
                var counter = 2;
                while (taken[base + " (" + counter + ")"] != undefined){
                    counter++;
                }
                return base + " (" + counter + ")";
            }

            function createFolder(folderName, editAfterCreate){
                if (folderName == undefined || folderName.trim() == ""){
                    folderName = applocale.getString("newfolder/defaultname", "New Folder");
                }
                folderName = folderName.trim().replace(/[<>:"/\\|?*]/g, "_");

                //Check if folder exists
                var nameAlreadyExists = false;
                currentFileList.forEach(function(fileObject){
                    if (fileObject.IsDir && fileObject.Filename == folderName){
                        nameAlreadyExists = true;
                    }
                });

                if (nameAlreadyExists){
                    alert(applocale.getString("message/folderexists", "Folder already exists"));
                    return;
                }

                //Create the new folder request
                requestCSRFToken(function(token){
                    $.ajax({
                        url: "../../system/file_system/newItem",
                        data: {type: "folder", src: currentDir, filename: folderName, csrft: token},
                        success: function(data){
                            if (data.error !== undefined){
                                alert(data.error);
                                return;
                            }
                            if (editAfterCreate){
                                //Picked up by renderFileList once the listing comes back
                                pendingInlineRename = folderName;
                            }
                            refresh();
                        }
                    });
                });
            }

            /* ------------------------------------------------------------------ */
            /*  Inline rename                                                      */
            /* ------------------------------------------------------------------ */
            var pendingInlineRename = null;     //Filename to edit after the next render
            var inlineEditActive = false;
            var closeActiveInlineEdit = null;   //Set while an editor is on screen

            function findFileObjectByName(filename){
                var match = null;
                $("#fileArea").find(".fileObject").each(function(){
                    if (decodeURIComponent($(this).attr("filename")) == filename){
                        match = this;
                    }
                });
                return match;
            }

            function startInlineRename(fileObjectDOM){
                if (fileObjectDOM == null){
                    return;
                }
                if (inlineEditActive && closeActiveInlineEdit != null){
                    //Commit whatever is already being edited rather than refusing.
                    //If focus never landed on that editor its blur would never fire
                    //and the flag would stay stuck, blocking every later rename.
                    closeActiveInlineEdit(true);
                }
                var target = $(fileObjectDOM);
                //List view labels the name in .fsRowName, grid view in .fsTileName
                var label = target.find(".fsRowName");
                if (label.length == 0){
                    label = target.find(".fsTileName");
                }
                if (label.length == 0){
                    return;
                }

                var originalName = decodeURIComponent(target.attr("filename"));
                var isDir = target.attr("isDir") == "true";
                inlineEditActive = true;

                label.addClass("editing");
                label.html('<input class="fsInlineEdit" type="text" spellcheck="false" autocomplete="off">');
                var input = label.find("input");
                input.val(originalName);

                //Swallow the row click handlers while the editor has focus
                input.on("click dblclick mousedown", function(event){
                    event.stopPropagation();
                });

                var settled = false;
                var finish = function(save){
                    if (settled){
                        //Enter commits and then blurs, guard the second pass
                        return;
                    }
                    settled = true;
                    inlineEditActive = false;
                    closeActiveInlineEdit = null;
                    var newName = input.val();
                    label.removeClass("editing");
                    label.text(originalName);
                    if (save && newName != undefined && newName.trim() != "" && newName.trim() != originalName){
                        commitInlineRename(target, originalName, newName.trim());
                    }
                };

                closeActiveInlineEdit = finish;

                input.on("keydown", function(event){
                    event.stopPropagation();
                    if (event.which == 13){
                        finish(true);
                    }else if (event.which == 27){
                        finish(false);
                    }
                });
                input.on("blur", function(){
                    //Clicking away saves, matching the desktop file managers
                    finish(true);
                });

                input.focus();
                //Preselect the basename so typing replaces the name but keeps the
                //extension, except on folders where the whole name is the target
                var dotIndex = originalName.lastIndexOf(".");
                if (!isDir && dotIndex > 0){
                    input[0].setSelectionRange(0, dotIndex);
                }else{
                    input[0].select();
                }
            }

            function commitInlineRename(target, originalName, newName){
                var safeName = newName.replace(/[<>:"/\\|?*]/g, "_");
                var filepath = decodeURIComponent(target.attr("filepath"));

                //Reject a name that is already used in this directory
                var clash = false;
                currentFileList.forEach(function(fileObject){
                    if (fileObject.Filename == safeName && fileObject.Filename != originalName){
                        clash = true;
                    }
                });
                if (clash){
                    alert(applocale.getString("message/nameexists", "An item with that name already exists"));
                    return;
                }

                requestCSRFToken(function(token){
                    $.ajax({
                        url: "../../system/file_system/fileOpr",
                        method: "POST",
                        data: {
                            opr: "rename",
                            src: JSON.stringify([filepath]),
                            new: JSON.stringify([safeName]),
                            csrft: token
                        },
                        success: function(data){
                            if (data.error !== undefined){
                                alert(data.error);
                                refresh();
                                return;
                            }
                            //Keep the renamed item highlighted after the reload
                            pendingSelectAfterRender = safeName;
                            refresh();
                        },
                        error: function(){
                            alert(applocale.getString("message/renamefailed", "Rename failed"));
                            refresh();
                        }
                    });
                });
            }

            function requestCSRFToken(callback){
                $.ajax({
                    url: "../../system/csrf/new",
                    success: function(token){
                        callback(token);
                    }
                });
            }

            /* ------------------------------------------------------------------ */
            /*  Context menu                                                       */
            /* ------------------------------------------------------------------ */
            /*
                Acts on the single item that was right clicked rather than on the
                current selection. The selector restricts what may be selected by
                launch type (a file cannot be highlighted in folder mode, and so on),
                so binding the menu to one explicit target keeps destructive actions
                such as Delete unambiguous.
            */
            var contextTarget = null;

            function showContextMenu(event, fileObjectDOM){
                event.preventDefault();
                event.stopPropagation();
                if (inlineEditActive){
                    return;
                }
                contextTarget = fileObjectDOM;
                closeMoreMenu();

                var isDir = $(fileObjectDOM).attr("isDir") == "true";
                var menu = $("#contextMenu");
                menu.html(buildContextMenuItems(isDir));
                menu.addClass("open");

                //Clamp to the viewport so the menu never opens off screen
                var width = menu.outerWidth();
                var height = menu.outerHeight();
                var left = event.clientX;
                var top = event.clientY;
                if (left + width > window.innerWidth - 6){
                    left = Math.max(6, window.innerWidth - width - 6);
                }
                if (top + height > window.innerHeight - 6){
                    top = Math.max(6, window.innerHeight - height - 6);
                }
                menu.css({left: left + "px", top: top + "px"});
            }

            function buildContextMenuItems(isDir){
                var items = [];
                items.push(contextMenuItem("open", ICONS.open, applocale.getString("ctx/open", "Open")));
                if (!isDir){
                    items.push(contextMenuItem("openwith", ICONS.viewGrid, applocale.getString("ctx/openwith", "Open With")));
                }else{
                    items.push(contextMenuItem("opennewwindow", ICONS.externalLink,
                        applocale.getString("ctx/opennewwindow", "Open in New Window")));
                }
                items.push('<div class="fsMenuSep"></div>');
                items.push(contextMenuItem("rename", ICONS.pencil, applocale.getString("ctx/rename", "Rename")));
                items.push(contextMenuItem("delete", ICONS.trash, applocale.getString("ctx/delete", "Delete")));
                items.push(contextMenuItem("download", ICONS.download, applocale.getString("ctx/download", "Download")));
                items.push('<div class="fsMenuSep"></div>');
                items.push(contextMenuItem("properties", ICONS.info, applocale.getString("ctx/properties", "Properties")));
                return items.join("");
            }

            function contextMenuItem(action, iconSVG, label){
                return '<div class="fsMenuItem" onclick="onContextAction(\'' + action + '\');">' +
                    '<span class="fsMenuIcon">' + iconSVG + '</span>' +
                    '<span>' + escapeHTML(label) + '</span></div>';
            }

            function closeContextMenu(){
                $("#contextMenu").removeClass("open");
            }

            function onContextAction(action){
                var target = contextTarget;
                closeContextMenu();
                if (target == null){
                    return;
                }
                var filepath = decodeURIComponent($(target).attr("filepath"));
                var filename = decodeURIComponent($(target).attr("filename"));
                var isDir = $(target).attr("isDir") == "true";

                if (action == "open"){
                    //Same as a double click: enter the folder, or pick the file
                    openThis(target, {preventDefault: function(){}});
                }else if (action == "openwith"){
                    ctxOpenWith(filepath, filename);
                }else if (action == "opennewwindow"){
                    ctxOpenInNewWindow(filepath, filename);
                }else if (action == "rename"){
                    startInlineRename(target);
                }else if (action == "delete"){
                    ctxDelete(filepath, filename);
                }else if (action == "download"){
                    ctxDownload(filepath, filename, isDir);
                }else if (action == "properties"){
                    ctxProperties(filepath);
                }
            }

            //Launch the opener picker so the user chooses which WebApp handles it
            function ctxOpenWith(filepath, filename){
                var openParameter = encodeURIComponent(JSON.stringify({
                    filepath: filepath,
                    filename: filename
                }));
                ao_module_newfw({
                    url: "SystemAO/file_system/defaultOpener.html#" + openParameter,
                    width: 320,
                    height: 510,
                    appicon: "SystemAO/file_system/img/opener.png",
                    title: "Select an opener WebApp"
                });
            }

            //Open this folder in its own File Manager window, leaving the picker alone
            function ctxOpenInNewWindow(filepath, filename){
                ao_module_newfw({
                    url: "SystemAO/file_system/file_explorer.html#" + encodeURIComponent(filepath),
                    width: 1080,
                    height: 580,
                    appicon: "SystemAO/file_system/img/small_icon.png",
                    title: filename
                });
            }

            function ctxDelete(filepath, filename){
                var question = applocale.getString("message/deleteconfirm", "Move this item to the trash bin?");
                if (!confirm(question + "\n\n" + filename)){
                    return;
                }
                requestCSRFToken(function(token){
                    $.ajax({
                        url: "../../system/file_system/fileOpr",
                        method: "POST",
                        data: {opr: "recycle", src: JSON.stringify([filepath]), csrft: token},
                        success: function(data){
                            if (data.error !== undefined){
                                alert(data.error);
                            }
                            refresh();
                        },
                        error: function(){
                            alert(applocale.getString("message/deletefailed", "Delete failed"));
                            refresh();
                        }
                    });
                });
            }

            function ctxDownload(filepath, filename, isDir){
                if (!isDir){
                    //Single file, stream it straight down
                    generateDownloadFromURL("../../media/download?file=" + encodeURIComponent(filepath), filename);
                    return;
                }
                //Folders have to be archived first, same as the File Manager does
                $.ajax({
                    url: "../../system/file_system/zipHandler",
                    method: "POST",
                    data: {opr: "tmpzip", src: JSON.stringify([filepath]), dest: ""},
                    success: function(data){
                        if (data.error !== undefined){
                            alert(data.error);
                            return;
                        }
                        generateDownloadFromURL("../../media/download?file=" + encodeURIComponent(data), filename + ".zip");
                    },
                    error: function(){
                        alert(applocale.getString("message/zipfailed", "Unable to compress this folder"));
                    }
                });
            }

            function generateDownloadFromURL(url, filename){
                var a = document.createElement("a");
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            function ctxProperties(filepath){
                ao_module_newfw({
                    url: "SystemAO/file_system/file_properties.html#" + encodeURIComponent(JSON.stringify([filepath])),
                    width: 340,
                    height: 480,
                    appicon: "SystemAO/file_system/img/properties.png",
                    title: "File Properties"
                });
            }

            /* ------------------------------------------------------------------ */
            /*  Toolbar menu                                                       */
            /* ------------------------------------------------------------------ */
            function toggleMoreMenu(event){
                event.stopPropagation();
                var isOpen = $("#moreMenu").hasClass("open");
                if (isOpen){
                    closeMoreMenu();
                }else{
                    $("#moreMenu").addClass("open");
                    $("#moreBtn").addClass("active");
                }
            }

            function closeMoreMenu(){
                $("#moreMenu").removeClass("open");
                $("#moreBtn").removeClass("active");
            }

            $(document).on("click", function(event){
                if ($(event.target).closest("#moreMenu, #moreBtn").length == 0){
                    closeMoreMenu();
                }
                if ($(event.target).closest("#contextMenu").length == 0){
                    closeContextMenu();
                }
            });

            //A right click anywhere else dismisses an open context menu
            $(document).on("contextmenu", function(event){
                if ($(event.target).closest(".fileObject").length == 0){
                    closeContextMenu();
                }
            });

            $("#fileArea").on("scroll", function(){
                closeContextMenu();
            });

            /* ------------------------------------------------------------------ */
            /*  Search                                                             */
            /* ------------------------------------------------------------------ */
            var searchDebounce = null;
            $("#searchInput").on("input", function(){
                var value = $(this).val().toLowerCase().trim();
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(function(){
                    searchKeyword = value;
                    renderFileList();
                }, 150);
            });

            /* ------------------------------------------------------------------ */
            /*  Keyboard                                                           */
            /* ------------------------------------------------------------------ */
            $(window).on("keydown", function(event){
                if (event.which == 17){
                    ctrlDown = true;
                }else if (event.which == 16){
                    shiftDown = true;
                }else if (event.which == 27){
                    //Escape backs out of the transient UI first, and only closes the
                    //whole dialog when there is nothing left to dismiss
                    if ($("#contextMenu").hasClass("open")){
                        closeContextMenu();
                        return;
                    }
                    if (inlineEditActive || $("#moreMenu").hasClass("open")){
                        closeMoreMenu();
                        return;
                    }
                    closeSelector();
                }else if (event.which == 13){
                    if ($(event.target).is("#addressbar") || inlineEditActive){
                        return;
                    }
                    closeContextMenu();
                    //Enter opens the highlighted folder, or confirms the selection
                    var selected = $("#fileArea").find(".fileObject.selected");
                    if (selected.length == 1 && selected.attr("isDir") == "true" && type != "folder"){
                        listDir(decodeURIComponent(selected.attr("filepath")));
                    }else{
                        confirmSelection();
                    }
                }
            });

            $(window).on("keyup", function(event){
                if (event.which == 17){
                    ctrlDown = false;
                }else if (event.which == 16){
                    shiftDown = false;
                }
            });

            //Clicking the empty area of the file list clears the selection
            $("#fileArea").on("click", function(event){
                if ($(event.target).closest(".fileObject, .fsListHead").length == 0){
                    $(".fileObject.selected").removeClass("selected");
                    setWindowTitleForSelection(0);
                    clearDetails();
                }
            });

            $(window).on("resize", function(){
                if (window.innerWidth >= 560){
                    closeSidebar();
                }
                updateFileAreaDensity();
            });
        </script>
