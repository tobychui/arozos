<!DOCTYPE html>
<html>
    <head>
        <title locale="title">File Operation</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
        <link rel="stylesheet" href="../../script/semantic/semantic.min.css">
        <script type="text/javascript" src="../../script/jquery.min.js"></script>
        <script type="text/javascript" src="../../script/semantic/semantic.min.js"></script>
        <script type="text/javascript" src="../../script/ao_module.js"></script>
        <script type="text/javascript" src="../../script/applocale.js"></script>
        <link rel="stylesheet" href="file_operation.css">
    </head>
    <body>
        <div id="dialog" class="fodialog">
            <div class="foheader">
                <div class="fotitle" id="dialogTitle">File Operation</div>
                <div class="foheaderbtns">
                    <div class="foiconbtn" id="collapseBtn" title="Collapse" onclick="toggleCollapse();">
                        <i class="chevron down icon"></i>
                    </div>
                </div>
            </div>
            <div class="fosummary" id="collapsedSummary">
                <div class="foprogress">
                    <div class="bar" id="summaryBar" style="width: 0%;"></div>
                </div>
                <div class="fosummarypercent" id="summaryPercent">0%</div>
            </div>
            <div class="fobody" id="dialogBody">
                <div id="operationList"></div>
                <div id="emptyState" class="foempty">
                    <i class="check circle outline icon"></i>
                    <span locale="empty/noOperation">No file operation running</span>
                </div>
            </div>
            <div class="fofooter" id="dialogFooter">
                <div class="fototal">
                    <i class="cloud icon"></i>
                    <span id="totalSizeText"></span>
                </div>
                <div class="fofooterbtns">
                    <button class="fobtn" id="clearCompletedBtn" onclick="clearCompleted();">
                        <i class="trash alternate outline icon"></i>
                        <span locale="footer/clearCompleted">Clear completed</span>
                    </button>
                    <button class="fobtn primary" id="cancelAllBtn" onclick="cancelAll();">
                        <i class="times icon"></i>
                        <span locale="footer/cancelAll">Cancel all</span>
                    </button>
                </div>
            </div>
        </div>
        <script type="text/javascript" src="js/file_operation/icons.js"></script>
        <script type="text/javascript" src="js/file_operation/dialog.js"></script>
    </body>
</html>
