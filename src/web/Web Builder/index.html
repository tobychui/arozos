<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="theme-color" content="#f97316">
    <title>ArozOS Site Builder</title>
    <link rel="icon" href="img/small_icon.png">

    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/canvas.css">
    <link rel="stylesheet" href="css/inspector.css">
    <link rel="stylesheet" href="css/colorpicker.css">

    <!-- jQuery is required by ao_module.js; the builder itself uses plain DOM APIs -->
    <script src="../script/jquery.min.js"></script>
    <script src="../script/ao_module.js"></script>
    <script src="js/embedcompat.js"></script>
</head>
<body>

<div id="wb-app">

    <!-- ─────────────────────────  Top bar  ───────────────────────── -->
    <header id="wb-topbar">
        <button id="wb-project-btn" type="button" title="Project actions">
            <span id="wb-project-name">My Website</span>
            <span class="wb-caret" id="wb-project-caret"></span>
        </button>

        <div class="wb-topbar-center">
            <div class="wb-device-switch">
                <button class="wb-device-btn active" data-device="base" type="button" title="Desktop"></button>
                <button class="wb-device-btn" data-device="tablet" type="button" title="Tablet"></button>
                <button class="wb-device-btn" data-device="mobile" type="button" title="Mobile"></button>
            </div>
            <div class="wb-topbar-sep"></div>
            <div class="wb-history">
                <button class="wb-icon-btn" id="wb-undo" type="button" title="Undo (Ctrl+Z)" disabled></button>
                <button class="wb-icon-btn" id="wb-redo" type="button" title="Redo (Ctrl+Shift+Z)" disabled></button>
            </div>
        </div>

        <div class="wb-topbar-right">
            <div id="wb-save-state">
                <span class="wb-save-icon"></span>
                <span class="wb-save-text">Saved</span>
            </div>
            <button class="wb-btn" id="wb-preview-btn" type="button">
                <span id="wb-preview-icon"></span><span>Preview</span>
            </button>
            <button class="wb-btn wb-btn-primary" id="wb-publish-btn" type="button">
                <span id="wb-publish-icon"></span><span>Publish</span>
            </button>
            <button class="wb-icon-btn" id="wb-more-btn" type="button" title="More"></button>
        </div>
    </header>

    <!-- ─────────────────────────  Main  ───────────────────────── -->
    <main id="wb-main">

        <!-- icon rail -->
        <nav id="wb-rail">
            <button class="wb-rail-btn wb-rail-primary active" data-panel="add" type="button">
                <span class="wb-rail-icon" data-icon="plus-circle"></span><span>Add</span>
            </button>
            <button class="wb-rail-btn" data-panel="pages" type="button">
                <span class="wb-rail-icon" data-icon="pages"></span><span>Pages</span>
            </button>
            <button class="wb-rail-btn" data-panel="layers" type="button">
                <span class="wb-rail-icon" data-icon="layers"></span><span>Layers</span>
            </button>
            <button class="wb-rail-btn" data-panel="design" type="button">
                <span class="wb-rail-icon" data-icon="brush"></span><span>Design</span>
            </button>
            <button class="wb-rail-btn" data-panel="settings" type="button">
                <span class="wb-rail-icon" data-icon="gear"></span><span>Settings</span>
            </button>
            <div class="wb-rail-spacer"></div>
            <button class="wb-rail-btn" data-panel="help" type="button">
                <span class="wb-rail-icon" data-icon="help"></span><span>Help</span>
            </button>
        </nav>

        <!-- left dock -->
        <aside id="wb-leftdock">

            <section class="wb-panel active" id="wb-panel-add">
                <div class="wb-panel-hd">
                    <h2 class="wb-panel-title">Add Elements<span class="wb-panel-tools"></span></h2>
                </div>
                <div class="wb-panel-bd"></div>
            </section>

            <section class="wb-panel" id="wb-panel-pages">
                <div class="wb-panel-hd">
                    <h2 class="wb-panel-title">Pages<span class="wb-panel-tools"></span></h2>
                </div>
                <div class="wb-panel-bd"></div>
                <div class="wb-subpanel"></div>
            </section>

            <section class="wb-panel" id="wb-panel-layers">
                <div class="wb-panel-hd">
                    <h2 class="wb-panel-title">Layers<span class="wb-panel-tools"></span></h2>
                </div>
                <div class="wb-panel-bd"></div>
                <div class="wb-subpanel"></div>
            </section>

            <section class="wb-panel" id="wb-panel-design">
                <div class="wb-panel-hd">
                    <h2 class="wb-panel-title">Design<span class="wb-panel-tools"></span></h2>
                </div>
                <div class="wb-panel-bd"></div>
            </section>

            <section class="wb-panel" id="wb-panel-settings">
                <div class="wb-panel-hd">
                    <h2 class="wb-panel-title">Settings<span class="wb-panel-tools"></span></h2>
                </div>
                <div class="wb-panel-bd"></div>
            </section>

            <section class="wb-panel" id="wb-panel-help">
                <div class="wb-panel-hd">
                    <h2 class="wb-panel-title">Help<span class="wb-panel-tools"></span></h2>
                </div>
                <div class="wb-panel-bd"></div>
            </section>

        </aside>

        <!-- canvas -->
        <section id="wb-stage">
            <div id="wb-stage-inner">
                <div id="wb-frame-holder">
                    <div id="wb-frame-wrap" style="width:1280px">
                        <div id="wb-frame-shell" class="device-base">
                            <iframe id="wb-canvas-frame" title="Page canvas"></iframe>
                        </div>
                    </div>

                    <div id="wb-overlay">
                        <div id="wb-hover-box"></div>
                        <div id="wb-hover-badge"></div>
                        <div id="wb-drop-zone"></div>
                        <div id="wb-drop-line"></div>
                        <div id="wb-size-tip"></div>

                        <div id="wb-select-box">
                            <div class="wb-badge" id="wb-badge">
                                <span class="wb-badge-label">Section</span>
                                <button class="wb-badge-btn edit" type="button" title="Edit"></button>
                                <button class="wb-badge-btn drag" type="button" title="Drag to move"></button>
                                <button class="wb-badge-btn remove" type="button" title="Delete"></button>
                            </div>
                            <div class="wb-handle" data-dir="nw"></div>
                            <div class="wb-handle" data-dir="n"></div>
                            <div class="wb-handle" data-dir="ne"></div>
                            <div class="wb-handle" data-dir="w"></div>
                            <div class="wb-handle" data-dir="e"></div>
                            <div class="wb-handle" data-dir="sw"></div>
                            <div class="wb-handle" data-dir="s"></div>
                            <div class="wb-handle" data-dir="se"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- inspector -->
        <aside id="wb-inspector">
            <div id="wb-insp-path"></div>

            <div id="wb-insp-head">
                <div id="wb-insp-title">
                    <div id="wb-insp-name">Heading</div>
                    <div id="wb-insp-id">#heading-1</div>
                </div>
                <div id="wb-insp-actions"></div>
            </div>

            <div id="wb-insp-tabs">
                <button class="wb-tab active" data-tab="content" type="button">Content</button>
                <button class="wb-tab" data-tab="design" type="button">Design</button>
                <button class="wb-tab" data-tab="advanced" type="button">Advanced</button>
            </div>

            <div id="wb-bp-hint"></div>

            <div id="wb-insp-body"></div>

            <div id="wb-insp-empty">
                <div class="wb-empty-icon" data-icon="box"></div>
                <h4>Nothing selected</h4>
                <p>Click an element on the canvas, or pick one from the Layers panel, to edit its content and style here.</p>
            </div>
        </aside>

    </main>

    <!-- ─────────────────────────  Status bar  ───────────────────────── -->
    <footer id="wb-statusbar">
        <div id="wb-breadcrumb"></div>

        <div class="wb-status-center">
            <div class="wb-status-mini">
                <button class="wb-device-btn active" data-device="base" type="button" title="Desktop"></button>
                <button class="wb-device-btn" data-device="mobile" type="button" title="Mobile"></button>
            </div>
            <div class="wb-zoom">
                <button class="wb-zoom-btn" id="wb-zoom-out" type="button" title="Zoom out"></button>
                <button id="wb-zoom-label" type="button" title="Reset zoom to 100%">100%</button>
                <button class="wb-zoom-btn" id="wb-zoom-in" type="button" title="Zoom in"></button>
            </div>
        </div>

        <div class="wb-status-right">
            <span id="wb-status-saved">Not saved yet</span>
            <span id="wb-status-dot"></span>
        </div>
    </footer>
</div>

<!-- floating text toolbar -->
<div id="wb-text-toolbar">
    <span class="wb-tt-label">Edit Text</span>
    <button class="wb-tt-btn" data-tt="edit" type="button" title="Edit on canvas"></button>
    <span class="wb-tt-sep"></span>
    <button class="wb-tt-btn" data-tt="align-left" type="button" title="Align left"></button>
    <button class="wb-tt-btn" data-tt="align-center" type="button" title="Align center"></button>
    <button class="wb-tt-btn" data-tt="align-right" type="button" title="Align right"></button>
    <span class="wb-tt-sep"></span>
    <button class="wb-tt-btn" data-tt="bold" type="button" title="Bold"></button>
    <button class="wb-tt-btn" data-tt="italic" type="button" title="Italic"></button>
    <button class="wb-tt-btn" data-tt="link" type="button" title="Insert link"></button>
    <span class="wb-tt-sep"></span>
    <button class="wb-tt-btn" data-tt="more" type="button" title="More"></button>
</div>

<!-- preview mode bar -->
<div id="wb-preview-bar" class="wb-hidden">
    <span id="wb-preview-bar-label">Preview mode</span>
    <button class="wb-btn wb-btn-sm" id="wb-exit-preview" type="button">Exit preview</button>
</div>

<div id="wb-modal-layer"></div>
<div id="wb-toast-layer"></div>
<div id="wb-busy"><div class="wb-spinner"></div><span>Working...</span></div>

<script src="js/icons.js"></script>
<script src="js/schema.js"></script>
<script src="js/model.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/colorpicker.js"></script>

<!-- Starter templates: kit and preset first, then one file per template -->
<script src="templates/kit.js"></script>
<script src="templates/registry.js"></script>
<script src="templates/preset.js"></script>
<script src="templates/t-ember.js"></script>
<script src="templates/t-aurora.js"></script>
<script src="templates/t-noir.js"></script>
<script src="templates/t-slate.js"></script>
<script src="templates/t-verdant.js"></script>
<script src="templates/t-cobalt.js"></script>
<script src="templates/t-bloom.js"></script>
<script src="templates/t-lumen.js"></script>
<script src="templates/t-circuit.js"></script>
<script src="templates/t-quartz.js"></script>
<script src="templates/t-pulse.js"></script>
<script src="templates/t-archive.js"></script>

<script src="js/canvas.js"></script>
<script src="js/gallery.js"></script>
<script src="js/palette.js"></script>
<script src="js/pages.js"></script>
<script src="js/layers.js"></script>
<script src="js/inspector.js"></script>
<script src="js/design.js"></script>
<script src="js/fileio.js"></script>
<script src="js/formgen.js"></script>
<script src="js/publish.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
<script>
    /* Fill every static chrome icon from the SVG registry (house rule: no emoji). */
    (function () {
        var map = {
            "wb-project-caret": ["caret-down", 13],
            "wb-undo": ["undo", 16],
            "wb-redo": ["redo", 16],
            "wb-preview-icon": ["play-circle", 15],
            "wb-publish-icon": ["publish", 15],
            "wb-more-btn": ["more-v", 17],
            "wb-zoom-out": ["minus", 13],
            "wb-zoom-in": ["plus", 13]
        };
        for (var id in map) {
            var el = document.getElementById(id);
            if (el) { el.innerHTML = WBIcon(map[id][0], map[id][1]); }
        }
        document.querySelectorAll("[data-device]").forEach(function (b) {
            var d = b.getAttribute("data-device");
            b.innerHTML = WBIcon(d === "base" ? "desktop" : d, 16);
        });
        document.querySelectorAll("[data-icon]").forEach(function (b) {
            b.innerHTML = WBIcon(b.getAttribute("data-icon"), b.classList.contains("wb-rail-icon") ? 19 : 20);
        });
        document.querySelectorAll("#wb-text-toolbar [data-tt]").forEach(function (b) {
            var m = {
                edit: "pencil", "align-left": "align-left", "align-center": "align-center",
                "align-right": "align-right", bold: "bold", italic: "italic",
                link: "link", more: "more-h"
            };
            b.innerHTML = WBIcon(m[b.getAttribute("data-tt")], 15);
        });
        var badge = document.getElementById("wb-badge");
        badge.querySelector(".edit").innerHTML = WBIcon("pencil", 11);
        badge.querySelector(".drag").innerHTML = WBIcon("grip", 11);
        badge.querySelector(".remove").innerHTML = WBIcon("close", 11);
    })();
</script>
</body>
</html>
